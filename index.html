/* ==================== IndexedDB ==================== */
const DB = {
  promise: null,
  open() {
    if (!this.promise) {
      this.promise = new Promise((resolve, reject) => {
        let req;
        try {
          req = indexedDB.open(DB_NAME, 2);
        } catch (e) {
          reject(e);
          return;
        }
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('customers')) {
            db.createObjectStore('customers', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('images')) {
            const store = db.createObjectStore('images', { keyPath: 'id' });
            store.createIndex('customerId', 'customerId', { unique: false });
            store.createIndex('noteId', 'noteId', { unique: false });
          } else {
            const store = req.transaction.objectStore('images');
            if (!store.indexNames.contains('customerId')) store.createIndex('customerId', 'customerId', { unique: false });
            if (!store.indexNames.contains('noteId')) store.createIndex('noteId', 'noteId', { unique: false });
          }
          if (!db.objectStoreNames.contains('notes')) {
            const notes = db.createObjectStore('notes', { keyPath: 'id' });
            notes.createIndex('kind', 'kind', { unique: false });
            notes.createIndex('customerId', 'customerId', { unique: false });
            notes.createIndex('createdAt', 'createdAt', { unique: false });
            notes.createIndex('dueDate', 'dueDate', { unique: false });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('无法打开本地数据库'));
        req.onblocked = () => reject(new Error('数据库被其他页面占用，请关闭其他标签页后刷新'));
      });
    }
    return this.promise;
  },
  async getCustomers() {
    const db = await this.open();
    return requestPromise(db.transaction('customers').objectStore('customers').getAll());
  },
  async putCustomer(customer) {
    const db = await this.open();
    const tx = db.transaction('customers', 'readwrite');
    tx.objectStore('customers').put(customer);
    await txDone(tx);
  },
  async putCustomers(customers) {
    if (!customers.length) return;
    const db = await this.open();
    const tx = db.transaction('customers', 'readwrite');
    const store = tx.objectStore('customers');
    customers.forEach(c => store.put(c));
    await txDone(tx);
  },
  async deleteCustomer(id) {
    const notes = await this.getNotes();
    const noteIds = notes.filter(n => n.customerId === id).map(n => n.id);
    const db = await this.open();
    const tx = db.transaction(['customers', 'images', 'notes'], 'readwrite');
    tx.objectStore('customers').delete(id);
    const noteStore = tx.objectStore('notes');
    noteIds.forEach(nid => noteStore.delete(nid));
    const imgStore = tx.objectStore('images');
    const cursorReq = imgStore.openCursor();
    cursorReq.onsuccess = () => {
      const cursor = cursorReq.result;
      if (cursor) {
        const img = cursor.value || {};
        if (img.customerId === id || noteIds.includes(img.noteId)) imgStore.delete(cursor.primaryKey);
        cursor.continue();
      }
    };
    await txDone(tx);
  },
  async getNotes() {
    const db = await this.open();
    return requestPromise(db.transaction('notes').objectStore('notes').getAll());
  },
  async putNote(note) {
    const db = await this.open();
    const tx = db.transaction('notes', 'readwrite');
    tx.objectStore('notes').put(note);
    await txDone(tx);
  },
  async putNotes(notes) {
    if (!notes.length) return;
    const db = await this.open();
    const tx = db.transaction('notes', 'readwrite');
    const store = tx.objectStore('notes');
    notes.forEach(n => store.put(n));
    await txDone(tx);
  },
  async deleteNote(id) {
    const db = await this.open();
    const tx = db.transaction(['notes', 'images'], 'readwrite');
    tx.objectStore('notes').delete(id);
    const imgStore = tx.objectStore('images');
    const cursorReq = imgStore.openCursor();
    cursorReq.onsuccess = () => {
      const cursor = cursorReq.result;
      if (cursor) {
        if ((cursor.value || {}).noteId === id) imgStore.delete(cursor.primaryKey);
        cursor.continue();
      }
    };
    await txDone(tx);
  },
  async getAllNoteImages() {
    const db = await this.open();
    const index = db.transaction('images').objectStore('images').index('noteId');
    return requestPromise(index.getAll());
  },
  async getImages(customerId) {
    const db = await this.open();
    const index = db.transaction('images').objectStore('images').index('customerId');
    return requestPromise(index.getAll(IDBKeyRange.only(customerId)));
  },
  async getAllImages() {
    const db = await this.open();
    return requestPromise(db.transaction('images').objectStore('images').getAll());
  },
  async putImage(image) {
    const db = await this.open();
    const tx = db.transaction('images', 'readwrite');
    tx.objectStore('images').put(image);
    await txDone(tx);
  },
  async putImages(images) {
    if (!images.length) return;
    const db = await this.open();
    const tx = db.transaction('images', 'readwrite');
    const store = tx.objectStore('images');
    images.forEach(img => store.put(img));
    await txDone(tx);
  },
  async deleteImage(id) {
    const db = await this.open();
    const tx = db.transaction('images', 'readwrite');
    tx.objectStore('images').delete(id);
    await txDone(tx);
  },
  async replaceAll(customers, images, notes) {
    const db = await this.open();
    const tx = db.transaction(['customers', 'images', 'notes'], 'readwrite');
    tx.objectStore('customers').clear();
    tx.objectStore('images').clear();
    tx.objectStore('notes').clear();
    const cs = tx.objectStore('customers');
    customers.forEach(c => cs.put(c));
    const is = tx.objectStore('images');
    images.forEach(i => is.put(i));
    const ns = tx.objectStore('notes');
    (notes || []).forEach(n => ns.put(n));
    await txDone(tx);
  }
};

function requestPromise(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('数据库操作失败'));
  });
}
function txDone(tx) {
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error('数据库写入失败'));
    tx.onabort = () => reject(tx.error || new Error('数据库写入被中止'));
  });
}

/* ==================== GitHub 云端存储 ==================== */
const GH_CFG_KEY = 'qingxi_gh_cfg_v1';
const GH_TOKEN_KEY = 'qingxi_gh_token_v1';
const GH_DIRTY_KEY = 'qingxi_gh_dirty_v1';

function readLS(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v == null ? fallback : v;
  } catch (e) {
    return fallback;
  }
}
function writeLS(key, value) {
  try {
    if (value == null) localStorage.removeItem(key);
    else localStorage.setItem(key, value);
    return true;
  } catch (e) {
    return false;
  }
}
function nowStamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(bin);
}
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result || '');
      const idx = result.indexOf(',');
      resolve(idx >= 0 ? result.slice(idx + 1) : result);
    };
    reader.onerror = () => reject(reader.error || new Error('图片读取失败'));
    reader.readAsDataURL(blob);
  });
}
function imageExt(type, name) {
  const t = String(type || '').toLowerCase();
  if (t.includes('jpeg') || t.includes('jpg')) return 'jpg';
  if (t.includes('webp')) return 'webp';
  if (t.includes('gif')) return 'gif';
  if (t.includes('svg')) return 'svg';
  if (t.includes('png')) return 'png';
  const m = String(name || '').toLowerCase().match(/\.([a-z0-9]{2,4})$/);
  return m ? m[1] : 'png';
}

const CLOUD = {
  cfg: {},
  token: '',
  sha: null,
  lastSyncAt: '',
  lastError: '',
  loadedFromCloud: false,
  pushTimer: null,
  chain: Promise.resolve(),
  init() {
    let cfg = {};
    try { cfg = JSON.parse(readLS(GH_CFG_KEY, '{}')) || {}; } catch (e) { cfg = {}; }
    this.cfg = cfg;
    this.token = readLS(GH_TOKEN_KEY, '') || '';
    this.lastSyncAt = readLS('qingxi_gh_last_sync', '') || '';
    return this;
  },
  configured() {
    return !!(this.cfg.owner && this.cfg.repo);
  },
  writable() {
    return this.configured() && !!this.token;
  },
  readonly() {
    return !this.writable();
  },
  branch() {
    return this.cfg.branch || 'main';
  },
  base() {
    return String(this.cfg.apiBase || 'https://api.github.com').replace(/\/+$/, '');
  },
  apiPath(rel) {
    return `${this.base()}/repos/${encodeURIComponent(this.cfg.owner)}/${encodeURIComponent(this.cfg.repo)}/contents/${rel.split('/').map(encodeURIComponent).join('/')}`;
  },
  rawUrl(rel, ver) {
    if (!this.configured()) return rel;
    const base = `https://raw.githubusercontent.com/${this.cfg.owner}/${this.cfg.repo}/${this.branch()}/${rel.split('/').map(encodeURIComponent).join('/')}`;
    return ver ? `${base}?v=${encodeURIComponent(ver)}` : base;
  },
  repoLabel() {
    return this.configured() ? `${this.cfg.owner}/${this.cfg.repo}@${this.branch()}` : '未连接仓库';
  },
  async request(method, url, body) {
    const headers = { Accept: 'application/vnd.github+json' };
    if (this.token) headers.Authorization = `Bearer ${this.token}`;
    let payload;
    if (body != null) {
      headers['Content-Type'] = 'application/json';
      payload = JSON.stringify(body);
    }
    let res;
    try {
      res = await fetch(url, { method, headers, body: payload, cache: 'no-store' });
    } catch (err) {
      throw new Error('网络请求失败，请检查网络或代理');
    }
    return res;
  },
  async getMeta(rel) {
    if (!this.writable()) return null;
    const res = await this.request('GET', this.apiPath(rel));
    if (res.status === 404) return null;
    if (res.status === 401 || res.status === 403) throw new Error('Token 无效或没有该仓库的 Contents 读写权限');
    if (!res.ok) throw new Error(`读取仓库信息失败（HTTP ${res.status}）`);
    const j = await res.json();
    return { sha: j.sha, size: j.size };
  },
  async putFile(rel, base64, message, sha, isRetry) {
    const body = { message, content: base64, branch: this.branch() };
    if (sha) body.sha = sha;
    const res = await this.request('PUT', this.apiPath(rel), body);
    if (res.status === 409 || res.status === 422) {
      if (!isRetry) {
        const meta = await this.getMeta(rel);
        return this.putFile(rel, base64, message, meta ? meta.sha : null, true);
      }
      throw new Error('conflict');
    }
    if (res.status === 401 || res.status === 403) throw new Error('Token 无权限写入该仓库');
    if (!res.ok) {
      let detail = '';
      try { const j = await res.json(); detail = j && j.message ? `：${j.message}` : ''; } catch (e) { /* ignore */ }
      throw new Error(`写入仓库失败（HTTP ${res.status}）${detail}`);
    }
    return res.json();
  },
  async deleteFile(rel) {
    if (!this.writable()) return;
    const meta = await this.getMeta(rel);
    if (!meta) return;
    const res = await this.request('DELETE', this.apiPath(rel), {
      message: `删除图片文件 ${rel}`,
      sha: meta.sha,
      branch: this.branch()
    });
    if (!res.ok && res.status !== 404) throw new Error(`删除仓库文件失败（HTTP ${res.status}）`);
  },
  async readData() {
    if (this.configured()) {
      // 已填 Token 时直接走 Contents API，避免 Pages/raw 的 CDN 缓存导致读不到刚写入的数据
      if (this.writable() || this.cfg.apiBase) {
        const res = await this.request('GET', this.apiPath('data.json'));
        if (res.status === 404) return null;
        if (!res.ok) throw new Error(`读取 data.json 失败（HTTP ${res.status}）`);
        const j = await res.json();
        const raw = atob(String(j.content || '').replace(/\s/g, ''));
        const bytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
        return JSON.parse(new TextDecoder('utf-8').decode(bytes));
      }
      const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = ctl ? setTimeout(() => ctl.abort(), 6000) : null;
      try {
        const res = await fetch(`${this.rawUrl('data.json')}?t=${Date.now()}`, { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
        if (res.status === 404) return null;
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (rawErr) {
        // raw 域名在部分网络下不可达，回退到同源（GitHub Pages）的 data.json
        const res2 = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!res2.ok) throw new Error(`读取 data.json 失败（raw 不可达，同源 HTTP ${res2.status}）`);
        return res2.json();
      } finally {
        if (timer) clearTimeout(timer);
      }
    }
    try {
      const res = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) return null;
      return res.json();
    } catch (e) {
      return null;
    }
  },
  buildPayload() {
    const images = this._imagesCache || [];
    return {
      version: 2,
      app: '清洗剂客户管理',
      updatedAt: new Date().toISOString(),
      customers: state.customers.map(c => {
        const copy = Object.assign({}, c);
        return copy;
      }),
      notes: state.notes.map(n => Object.assign({}, n)),
      images: images.map(img => ({
        id: img.id,
        customerId: img.customerId || '',
        noteId: img.noteId || '',
        name: img.name || '',
        type: img.type || '',
        size: img.size || 0,
        caption: img.caption || '',
        path: img.path || '',
        createdAt: img.createdAt || ''
      }))
    };
  },
  async snapshotImages() {
    const all = await DB.getAllImages();
    this._imagesCache = all;
    return all;
  },
  schedulePush() {
    if (!this.writable()) return;
    if (this.pushTimer) clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => {
      this.pushTimer = null;
      this.enqueue();
    }, 900);
  },
  enqueue(force) {
    this.chain = this.chain.then(() => this.pushNow(force)).catch(err => {
      this.lastError = err && err.message === 'conflict'
        ? '仓库里的 data.json 已被其他设备更新，已停止覆盖'
        : (err.message || String(err));
      writeLS(GH_DIRTY_KEY, '1');
      state.syncError = this.lastError + '。本地修改已保存在缓存中，请刷新或稍后重试。';
      renderSyncBar();
      toast(this.lastError.includes('conflict') || this.lastError.includes('其他设备')
        ? '同步冲突：请先点「从仓库重新拉取」，再重新修改'
        : `云端同步失败：${this.lastError}`, 'error');
    });
    return this.chain;
  },
  async pushNow(force) {
    if (!this.writable()) return false;
    await this.snapshotImages();
    const payload = this.buildPayload();
    const meta = await this.getMeta('data.json');
    const remoteSha = meta ? meta.sha : null;
    if (!force && this.sha && remoteSha && remoteSha !== this.sha) {
      throw new Error('conflict');
    }
    const res = await this.putFile('data.json', utf8ToBase64(JSON.stringify(payload, null, 2)),
      `更新客户数据 ${nowStamp()}`, remoteSha || undefined);
    this.sha = res && res.content ? res.content.sha : null;
    this.lastSyncAt = nowStamp();
    this.lastError = '';
    writeLS('qingxi_gh_last_sync', this.lastSyncAt);
    writeLS(GH_DIRTY_KEY, null);
    state.syncError = '';
    state.syncAt = this.lastSyncAt;
    renderSyncBar();
    return true;
  },
  async uploadImage(record) {
    if (!this.writable()) return '';
    const rel = `images/${record.id}.${imageExt(record.type, record.name)}`;
    const b64 = await blobToBase64(record.blob);
    await this.putFile(rel, b64, `上传图片 ${record.name || record.id} ${nowStamp()}`, null);
    return rel;
  },
  async bootstrap() {
    const dirty = readLS(GH_DIRTY_KEY, '') === '1';
    const data = await this.readData();
    if (dirty && data) {
      state.syncError = '上次同步未完成，本地有未上传的修改。可点「云端设置 → 立即上传」重试。';
      return { applied: false, reason: 'dirty' };
    }
    if (!data) return { applied: false, reason: 'empty' };
    await applyCloudData(data);
    this.loadedFromCloud = true;
    if (this.writable()) {
      const meta = await this.getMeta('data.json').catch(() => null);
      this.sha = meta ? meta.sha : null;
    }
    return { applied: true };
  }
};

async function applyCloudData(data) {
  const customers = Array.isArray(data.customers) ? data.customers.map(normalizeCustomer) : [];
  const notes = Array.isArray(data.notes) ? data.notes.map(normalizeNote) : [];
  const images = Array.isArray(data.images) ? data.images.map(img => ({
    id: String(img.id || uid()),
    customerId: img.customerId ? String(img.customerId) : '',
    noteId: img.noteId ? String(img.noteId) : '',
    name: img.name || '',
    type: img.type || '',
    size: img.size || 0,
    caption: img.caption || '',
    path: img.path || '',
    createdAt: img.createdAt || ''
  })).filter(img => img.path) : [];
  await DB.replaceAll(customers, images, notes);
  await reloadStateFromDB();
}

/* DB 写操作后自动排一次云端同步（只读时自动跳过） */
['putCustomer', 'putCustomers', 'deleteCustomer', 'putNote', 'putNotes', 'deleteNote',
 'putImage', 'putImages', 'deleteImage', 'replaceAll'].forEach(name => {
  const original = DB[name].bind(DB);
  DB[name] = async function (...args) {
    const result = await original(...args);
    if (name !== 'replaceAll') CLOUD.schedulePush();
    return result;
  };
});

const imageUrlCache = new Map();
let imagesLoadingFor = null;

function imageUrl(img) {
  if (!img) return '';
  if (img.path) return img.path;
  if (!img.blob) return '';
  if (!imageUrlCache.has(img.id)) {
    imageUrlCache.set(img.id, URL.createObjectURL(img.blob));
  }
  return imageUrlCache.get(img.id);
}
function revokeImageUrl(id) {
  if (imageUrlCache.has(id)) {
    URL.revokeObjectURL(imageUrlCache.get(id));
    imageUrlCache.delete(id);
  }
}
function revokeAllImageUrls() {
  imageUrlCache.forEach(url => URL.revokeObjectURL(url));
  imageUrlCache.clear();
}

/* ==================== 页面骨架 ==================== */
function renderApp() {
  renderTopbar();
  const main = document.getElementById('main');
  if (!main) return;
  if (state.view === 'dashboard') {
    main.innerHTML = renderDashboard();
  } else if (state.view === 'customers') {
    main.innerHTML = renderWorkspace();
    afterWorkspaceRender();
  } else if (state.view === 'notes') {
    main.innerHTML = renderNotesView();
  } else if (state.view === 'calendar') {
    main.innerHTML = renderCalendarView();
  } else if (state.view === 'inbox') {
    main.innerHTML = renderInboxView();
  }
  updateInboxBadge();
  renderSyncBar();
}

function renderSyncBar() {
  const bar = document.getElementById('syncBar');
  if (!bar) return;
  const writable = CLOUD.writable();
  state.readonly = !writable;
  bar.hidden = false;
  bar.classList.remove('ro', 'err');
  let html = '';
  if (!CLOUD.configured()) {
    bar.classList.add('ro');
    html = `<span class="dot"></span><span>只读模式 · 尚未填写仓库信息，正在显示仓库里的 data.json</span>
      <span class="spacer"></span><button data-sync="settings">连接仓库</button>`;
  } else if (!writable) {
    bar.classList.add('ro');
    html = `<span class="dot"></span><span>只读模式 · ${esc(CLOUD.repoLabel())}，填写 Token 后才能修改
      <span class="sync-hint">（所有人可查看）</span></span>
      <span class="spacer"></span><button data-sync="settings">填写 Token</button>`;
  } else if (state.syncError) {
    bar.classList.add('err');
    html = `<span class="dot"></span><span>${esc(state.syncError)}</span>
      <span class="spacer"></span><button data-sync="settings">打开设置</button>`;
  } else {
    const t = state.syncAt || CLOUD.lastSyncAt;
    html = `<span class="dot"></span><span>云端已连接 · ${esc(CLOUD.repoLabel())}
      <span class="sync-hint">${t ? '上次同步 ' + esc(t) : '等待首次修改'}</span></span>
      <span class="spacer"></span><button data-sync="settings">设置</button>
      <button data-sync="pull">从仓库刷新</button>`;
  }
  bar.innerHTML = html;
  bar.querySelectorAll('[data-sync]').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.sync;
      if (act === 'settings') openCloudSettings();
      else if (act === 'pull') pullFromCloud();
    });
  });
}

function renderTopbar() {
  document.querySelectorAll('[data-view]').forEach(el => {
    if (el.classList.contains('tab')) {
      el.classList.toggle('is-active', el.dataset.view === state.view);
    }
  });
  const loadBtn = document.querySelector('[data-sample-load]');
  const removeBtn = document.querySelector('[data-sample-remove]');
  if (loadBtn) loadBtn.hidden = hasSample();
  if (removeBtn) removeBtn.hidden = !hasSample();
  const menu = document.getElementById('dataMenu');
  if (menu && !menu.contains(document.activeElement)) menu.open = false;
}

function updateInboxBadge() {
  const el = document.getElementById('inboxBadge');
  if (!el) return;
  const n = inboxCount();
  el.textContent = n > 99 ? '99+' : String(n);
  el.hidden = n === 0;
  el.classList.toggle('is-zero', n === 0);
}

async function loadImagesFor(customerId) {
  if (imagesLoadingFor === customerId) return;
  imagesLoadingFor = customerId;
  state.imagesLoading = true;
  try {
    const imgs = await DB.getImages(customerId);
    if (state.selectedId !== customerId) return;
    state.images = imgs.sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
    state.imagesError = '';
  } catch (err) {
    if (state.selectedId === customerId) {
      state.images = [];
      state.imagesError = '图片读取失败，请重试';
    }
  } finally {
    if (state.selectedId === customerId) {
      state.imagesLoading = false;
      renderDetailOnly();
      bindDropzone();
    }
    if (imagesLoadingFor === customerId) imagesLoadingFor = null;
  }
}

/* ==================== 弹层、提示与全局事件 ==================== */
const modalStack = [];
let lightboxEl = null;
let lightboxIndex = 0;

function toast(message, type = 'ok') {
  const root = document.getElementById('toastRoot');
  if (!root) return;
  while (root.children.length >= 3) root.removeChild(root.firstElementChild);
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'error' ? 'error' : type === 'info' ? 'info' : '');
  el.innerHTML = `${icon(type === 'error' ? 'alert' : type === 'info' ? 'info' : 'check', 14)}<span>${esc(message)}</span>`;
  root.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 220);
  }, 2800);
}

function createModal(options) {
  const opts = Object.assign({
    title: '', subtitle: '', body: '', footer: '', small: false,
    backdropClose: true, escapeClose: true, onMount: null, onClose: null
  }, options || {});

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const modal = document.createElement('div');
  modal.className = 'modal' + (opts.small ? ' small' : '');
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  modal.setAttribute('aria-label', opts.title || '对话框');
  modal.innerHTML = `
    <div class="modal-head">
      <div style="min-width:0">
        <div class="modal-title">${esc(opts.title)}</div>
        ${opts.subtitle ? `<div class="modal-sub">${esc(opts.subtitle)}</div>` : ''}
      </div>
      <button class="icon-btn" data-modal-close aria-label="关闭">${icon('x', 16)}</button>
    </div>
    <div class="modal-body">${opts.body}</div>
    ${opts.footer ? `<div class="modal-foot">${opts.footer}</div>` : ''}`;
  overlay.appendChild(modal);
  document.getElementById('modalRoot').appendChild(overlay);
  document.body.classList.add('modal-open');

  const prevFocus = document.activeElement;
  const entry = { overlay, modal, close: null, escapeClose: opts.escapeClose };
  modalStack.push(entry);
  let closed = false;

  entry.close = value => {
    if (closed) return;
    closed = true;
    const idx = modalStack.indexOf(entry);
    if (idx >= 0) modalStack.splice(idx, 1);
    overlay.remove();
    if (!modalStack.length && !lightboxEl) document.body.classList.remove('modal-open');
    try {
      if (prevFocus && document.contains(prevFocus) && typeof prevFocus.focus === 'function') {
        prevFocus.focus({ preventScroll: true });
      }
    } catch (e) { /* ignore */ }
    if (opts.onClose) opts.onClose(value);
  };

  modal.querySelectorAll('[data-modal-close]').forEach(btn => {
    btn.addEventListener('click', () => entry.close(null));
  });
  overlay.addEventListener('mousedown', e => {
    if (e.target === overlay && opts.backdropClose) entry.close(null);
  });
  if (opts.onMount) opts.onMount(modal, entry.close);
  requestAnimationFrame(() => {
    const target = modal.querySelector('[data-autofocus]') ||
      modal.querySelector('input:not([type="hidden"]),select,textarea') ||
      modal.querySelector('[data-modal-close]');
    if (target) {
      try { target.focus(); } catch (e) { /* ignore */ }
    }
  });
  return entry;
}

function confirmDialog(options) {
  const opts = Object.assign({
    title: '请确认', message: '', confirmText: '确认删除', cancelText: '取消',
    danger: true, iconName: 'trash'
  }, options || {});
  return new Promise(resolve => {
    let settled = false;
    const entry = createModal({
      title: opts.title,
      small: true,
      body: `<div class="confirm-box">
        <div class="confirm-icon ${opts.danger ? '' : 'warn'}">${icon(opts.iconName, 19)}</div>
        <div class="confirm-text">${opts.message}</div>
      </div>`,
      footer: `<button class="btn btn-secondary" data-modal-close data-autofocus>${esc(opts.cancelText)}</button>
        <button class="btn ${opts.danger ? 'btn-danger-solid' : 'btn-primary'}" id="confirmAction">${esc(opts.confirmText)}</button>`,
      onClose: () => {
        if (!settled) {
          settled = true;
          resolve(false);
        }
      }
    });
    const actionBtn = entry.modal.querySelector('#confirmAction');
    actionBtn.addEventListener('click', () => {
      if (settled) return;
      settled = true;
      entry.close(true);
      resolve(true);
    });
  });
}

function bindGlobalEvents() {
  document.addEventListener('click', onDocumentClick);
  document.addEventListener('input', onDocumentInput);
  document.addEventListener('change', onDocumentChange);
  document.addEventListener('submit', onDocumentSubmit);
  document.addEventListener('paste', onPaste);
  document.addEventListener('keydown', onKeyDown);
  window.addEventListener('dragover', preventFileDrop);
  window.addEventListener('drop', preventFileDrop);
}

function preventFileDrop(e) {
  if (state.view === 'customers' && state.selectedId && !modalStack.length && !lightboxEl) {
    e.preventDefault();
  }
}

function onDocumentClick(e) {
  document.querySelectorAll('details.menu[open]').forEach(menu => {
    if (!menu.contains(e.target)) menu.open = false;
  });

  const actionEl = e.target.closest('[data-action]');
  if (actionEl) {
    e.preventDefault();
    const menu = actionEl.closest('details.menu');
    if (menu) menu.open = false;
    handleAction(actionEl.dataset.action, actionEl);
    return;
  }

  const viewEl = e.target.closest('[data-view]');
  if (viewEl) {
    e.preventDefault();
    switchView(viewEl.dataset.view);
    return;
  }

  const stageFilter = e.target.closest('[data-stage-filter]');
  if (stageFilter) {
    state.stage = stageFilter.dataset.stageFilter;
    state.view = 'customers';
    state.mobileDetail = false;
    renderApp();
    window.scrollTo(0, 0);
    return;
  }

  const chip = e.target.closest('[data-stage-chip]');
  if (chip) {
    state.stage = chip.dataset.stageChip;
    document.querySelectorAll('[data-stage-chip]').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.stageChip === state.stage);
    });
    updateListOnly();
    return;
  }

  const customerEl = e.target.closest('[data-open-customer]');
  if (customerEl) {
    openCustomer(customerEl.dataset.openCustomer, true);
    return;
  }

  const imageEl = e.target.closest('[data-open-image]');
  if (imageEl) {
    openLightbox(imageEl.dataset.openImage);
  }
}

function onDocumentInput(e) {
  const target = e.target;
  if (!target || !target.id) return;
  if (target.id === 'searchInput') {
    state.search = target.value;
    updateListOnly();
    return;
  }
  if (target.id === 'qnCompany' && quickNoteCtx) {
    quickNoteCtx.qn.companyName = target.value;
    const match = state.customers.find(c => c.company === target.value.trim());
    quickNoteCtx.qn.customerId = match ? match.id : '';
    target.classList.toggle('matched', !!match);
    return;
  }
  if (target.id === 'qnTags' && quickNoteCtx) {
    quickNoteCtx.qn.tags = parseTags(target.value);
    return;
  }
  if (target.id === 'editorCompany' && editorCtx) {
    editorCtx.draft.companyName = target.value;
    const match = state.customers.find(c => c.company === target.value.trim());
    editorCtx.draft.customerId = match ? match.id : '';
    target.classList.toggle('matched', !!match);
    return;
  }
  if (target.id === 'editorTags' && editorCtx) {
    editorCtx.draft.tags = parseTags(target.value);
  }
}

function onDocumentChange(e) {
  const target = e.target;
  if (!target) return;
  if (target.id === 'imageInput') {
    const files = target.files ? Array.from(target.files) : [];
    target.value = '';
    if (files.length) addImageFiles(files);
    return;
  }
  if (target.id === 'qnImageInput') {
    const files = target.files ? Array.from(target.files) : [];
    target.value = '';
    if (files.length) addQuickFiles(files);
    return;
  }
  if (target.id === 'editorImageInput') {
    const files = target.files ? Array.from(target.files) : [];
    target.value = '';
    if (files.length) addEditorFiles(files);
    return;
  }
  if (target.id === 'importInput') {
    const file = target.files && target.files[0];
    target.value = '';
    if (file) handleImportFile(file);
    return;
  }
  if (target.id === 'qnDue' && quickNoteCtx) {
    quickNoteCtx.qn.dueDate = target.value;
    return;
  }
  if (target.id === 'editorDue' && editorCtx) {
    editorCtx.draft.dueDate = target.value;
    return;
  }
  if (target.id === 'noteRangeFrom' || target.id === 'noteRangeTo') {
    if (target.id === 'noteRangeFrom') state.noteFrom = target.value;
    else state.noteTo = target.value;
    renderApp();
    return;
  }
  if (target.classList.contains('thumb-caption')) {
    saveCaption(target.dataset.captionId, target.value);
    return;
  }
  if (target.matches('[data-note-select]')) {
    if (target.checked) state.selectedNoteIds.add(target.dataset.noteSelect);
    else state.selectedNoteIds.delete(target.dataset.noteSelect);
    syncNoteSelectionUI();
    return;
  }
  if (target.matches('[data-note-done]')) {
    toggleNoteDone(target.dataset.id, target.checked);
    return;
  }
  if (target.matches('[data-inbox-tags]')) {
    saveInboxTags(target.dataset.id, target.value);
  }
}

function onDocumentSubmit(e) {
  if (e.target && e.target.id === 'followupForm') {
    e.preventDefault();
    handleFollowupSubmit(e.target);
  }
}

function onPaste(e) {
  const cd = e.clipboardData;
  if (!cd) return;
  const files = [];
  Array.from(cd.items || []).forEach(item => {
    if (item.kind === 'file' && item.type && item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) files.push(file);
    }
  });
  if (quickNoteCtx) {
    if (files.length) {
      e.preventDefault();
      addQuickFiles(files);
    }
    return;
  }
  if (editorCtx) {
    if (files.length) {
      e.preventDefault();
      addEditorFiles(files);
    }
    return;
  }
  if (!state.selectedId || state.view !== 'customers' || modalStack.length || lightboxEl) return;
  if (!files.length) return;
  e.preventDefault();
  addImageFiles(files);
}

function onKeyDown(e) {
  if (e.altKey && !e.ctrlKey && !e.metaKey && (e.key === 'n' || e.key === 'N')) {
    e.preventDefault();
    openQuickNote();
    return;
  }
  if (modalStack.length) {
    if (e.key === 'Escape') {
      const top = modalStack[modalStack.length - 1];
      if (top.escapeClose !== false) {
        e.preventDefault();
        top.close(null);
      }
    }
    return;
  }
  if (lightboxEl) {
    if (e.key === 'Escape') {
      e.preventDefault();
      closeLightbox();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      moveLightbox(-1);
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      moveLightbox(1);
    }
    return;
  }
  if (e.key === 'Escape') {
    const menu = document.querySelector('details.menu[open]');
    if (menu) menu.open = false;
  }
}

function switchView(view) {
  if (!['dashboard', 'customers', 'notes', 'calendar', 'inbox'].includes(view)) return;
  if (state.view === view) {
    window.scrollTo(0, 0);
    return;
  }
  state.view = view;
  if (view === 'customers') state.mobileDetail = false;
  renderApp();
  window.scrollTo(0, 0);
}

function openCustomer(id, showDetail = true) {
  const customer = state.customers.find(c => c.id === id);
  if (!customer) {
    toast('客户不存在或已被删除', 'error');
    return;
  }
  const same = state.selectedId === id && state.view === 'customers';
  state.selectedId = id;
  state.view = 'customers';
  state.mobileDetail = showDetail;
  if (!same) {
    state.images = null;
    state.imagesError = '';
    state.imagesLoading = false;
    imagesLoadingFor = null;
  }
  renderApp();
  requestAnimationFrame(() => {
    const pane = document.getElementById('detailPane');
    if (!pane) return;
    if (window.matchMedia('(max-width: 860px)').matches) {
      pane.scrollIntoView({ block: 'start' });
    } else {
      pane.scrollTop = 0;
    }
  });
}

function updateListOnly() {
  const listEl = document.getElementById('customerList');
  const list = filteredCustomers();
  if (listEl) listEl.innerHTML = renderCustomerListItems(list);
  const meta = document.querySelector('.list-meta');
  if (meta) {
    meta.innerHTML = `<span>${list.length} 位客户${state.search || state.stage !== 'all' ? '（筛选结果）' : ''}</span><span>按最近更新</span>`;
  }
  const clearBtn = document.querySelector('.search-clear');
  if (clearBtn) clearBtn.hidden = !state.search;
}

function handleAction(action, el) {
  switch (action) {
    case 'new-customer':
      openCustomerForm(null);
      break;
    case 'edit-customer':
      openCustomerForm(el.dataset.id || state.selectedId);
      break;
    case 'delete-customer':
      deleteCustomer(el.dataset.id || state.selectedId);
      break;
    case 'back-to-list': {
      state.mobileDetail = false;
      const ws = document.querySelector('.workspace');
      if (ws) ws.classList.remove('mobile-detail');
      window.scrollTo(0, 0);
      break;
    }
    case 'clear-search': {
      state.search = '';
      const input = document.getElementById('searchInput');
      if (input) {
        input.value = '';
        input.focus();
      }
      updateListOnly();
      break;
    }
    case 'clear-filters':
      state.search = '';
      state.stage = 'all';
      renderApp();
      requestAnimationFrame(() => {
        const input = document.getElementById('searchInput');
        if (input) input.focus();
      });
      break;
    case 'add-image': {
      if (!getSelected()) return;
      const input = document.getElementById('imageInput');
      if (input) input.click();
      break;
    }
    case 'delete-image':
      deleteImage(el.dataset.id);
      break;
    case 'delete-followup':

async function copyText(text, label) {
  const value = String(text || '');
  if (!value) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(value);
    } else {
      throw new Error('no clipboard');
    }
    toast(`${label}已复制`);
  } catch (err) {
    const area = document.createElement('textarea');
    area.value = value;
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    try {
      document.execCommand('copy');
      toast(`${label}已复制`);
    } catch (e2) {
      toast('复制失败，请手动选择', 'error');
    }
    area.remove();
  }
}

async function handleFollowupSubmit(form) {
  if (!ensureWritable()) return;
  const customer = getSelected();
  if (!customer) return;
  const dateInput = form.querySelector('[name="date"]');
  const methodInput = form.querySelector('[name="method"]');
  const contentInput = form.querySelector('[name="content"]');
  const date = (dateInput && dateInput.value) || todayStr();
  const method = (methodInput && methodInput.value) || '电话';
  const content = contentInput ? contentInput.value.trim() : '';
  if (!content) {
    toast('请填写跟进内容', 'error');
    if (contentInput) contentInput.focus();
    return;
  }
  const now = new Date().toISOString();
  const record = { id: uid(), date, method, content, createdAt: now };
  const prevUpdated = customer.updatedAt;
  customer.followUps.push(record);
  customer.updatedAt = now;
  try {
    await DB.putCustomer(customer);
  } catch (err) {
    customer.followUps = customer.followUps.filter(f => f.id !== record.id);
    customer.updatedAt = prevUpdated;
    toast('跟进记录保存失败，请重试', 'error');
    return;
  }
  sortCustomers();
  updateListOnly();
  renderDetailOnly();
  const newForm = document.getElementById('followupForm');
  if (newForm) {
    const nd = newForm.querySelector('[name="date"]');
    const nm = newForm.querySelector('[name="method"]');
    const nc = newForm.querySelector('[name="content"]');
    if (nd) nd.value = date;
    if (nm) nm.value = method;
    if (nc) {
      nc.value = '';
      nc.focus();
    }
  }
  toast('跟进记录已添加');
}

async function deleteFollowup(id) {
  if (!ensureWritable()) return;
  const customer = getSelected();
  if (!customer) return;
  const record = customer.followUps.find(f => f.id === id);
  if (!record) return;
  const ok = await confirmDialog({
    title: '删除跟进记录',
    message: `确定删除 <strong>${esc(fmtDate(record.date))}</strong> 的这条记录吗？<br><br>“${esc(record.content.slice(0, 80))}${record.content.length > 80 ? '…' : ''}”`,
    confirmText: '删除记录'
  });
  if (!ok) return;
  const prevUpdated = customer.updatedAt;
  customer.followUps = customer.followUps.filter(f => f.id !== id);
  customer.updatedAt = new Date().toISOString();
  try {
    await DB.putCustomer(customer);
  } catch (err) {
    toast('删除失败，请重试', 'error');
    return;
  }
  sortCustomers();
  updateListOnly();
  renderDetailOnly();
  toast('跟进记录已删除');
}

async function deleteCustomer(id) {
  if (!ensureWritable()) return;
  const customer = state.customers.find(c => c.id === id);
  if (!customer) return;
  let imageCount = 0;
  try {
    imageCount = (await DB.getImages(id)).length;
  } catch (err) { /* ignore */ }
  const noteCount = state.notes.filter(n => n.customerId === id).length;
  const extraParts = [];
  if (imageCount) extraParts.push(`<strong>${imageCount}</strong> 张现场图片`);
  if (noteCount) extraParts.push(`<strong>${noteCount}</strong> 条随手记`);
  const extra = extraParts.length ? '及其 ' + extraParts.join('、') : '及其全部档案';
  const ok = await confirmDialog({
    title: '删除客户',
    message: `确定删除 <strong>${esc(customer.company)}</strong> ${extra}吗？<br><br>删除后无法恢复，建议先导出备份。`,
    confirmText: '确认删除'
  });
  if (!ok) return;
  try {
    await DB.deleteCustomer(id);
  } catch (err) {
    toast('删除失败，请重试', 'error');
    return;
  }
  if (state.selectedId === id && state.images) {
    state.images.forEach(img => revokeImageUrl(img.id));
  }
  closeLightbox();
  state.customers = state.customers.filter(c => c.id !== id);
  const removedNotes = state.notes.filter(n => n.customerId === id);
  removedNotes.forEach(n => {
    noteImagesOf(n.id).forEach(img => revokeImageUrl(img.id));
    state.selectedNoteIds.delete(n.id);
  });
  const removedIds = new Set(removedNotes.map(n => n.id));
  state.notes = state.notes.filter(n => !removedIds.has(n.id));
  state.noteImages = state.noteImages.filter(img => !removedIds.has(img.noteId));
  if (state.selectedId === id) {
    state.selectedId = null;
    state.images = null;
    state.imagesError = '';
    state.mobileDetail = false;
  }
  renderApp();
  toast('客户已删除');
}

function buildFormField(field, value, extra) {
  const id = 'f_' + field.key;
  const req = field.key === 'company' ? ' <span class="req">*</span>' : '';
  let control = '';
  if (field.key === 'stage') {
    const names = STAGES.map(s => s.name);
    if (value && !names.includes(value)) names.unshift(value);
    control = `<select id="${id}" name="stage">${names.map(name =>
      `<option value="${esc(name)}" ${name === value ? 'selected' : ''}>${esc(name)}</option>`).join('')}</select>`;
  } else if (field.key === 'source') {
    const names = SOURCES.slice();
    if (value && !names.includes(value)) names.push(value);
    control = `<select id="${id}" name="source">
      <option value="">请选择来源</option>
      ${names.map(name => `<option value="${esc(name)}" ${name === value ? 'selected' : ''}>${esc(name)}</option>`).join('')}
    </select>`;
  } else if (field.textarea) {
    control = `<textarea id="${id}" name="${field.key}" placeholder="${esc(field.ph || '')}">${esc(value)}</textarea>`;
  } else {
    const type = field.type || 'text';
    control = `<input id="${id}" name="${field.key}" type="${type}" value="${esc(value)}"
      placeholder="${esc(field.ph || '')}" autocomplete="off" ${field.key === 'company' ? 'required maxlength="100" data-autofocus' : ''}>`;
  }
  return `<div class="field ${field.full ? 'full' : ''}">
    <label for="${id}">${esc(field.label)}${req}</label>
    ${control}
  </div>`;
}

function bindDropzone() {
  const dz = document.getElementById('imageCard');
  if (!dz || dz.dataset.dropBound === '1') return;
  dz.dataset.dropBound = '1';
  ['dragenter', 'dragover'].forEach(evt => {
    dz.addEventListener(evt, e => {
      if (!state.selectedId) return;
      e.preventDefault();
      e.stopPropagation();
      dz.classList.add('dragover');
    });
  });
  dz.addEventListener('dragleave', e => {
    if (!dz.contains(e.relatedTarget)) dz.classList.remove('dragover');
  });
  dz.addEventListener('drop', e => {
    e.preventDefault();
    e.stopPropagation();
    dz.classList.remove('dragover');
    const files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) addImageFiles(files);
  });
}

async function addImageFiles(fileList) {
  if (!ensureWritable()) return;
  const customer = getSelected();
  if (!customer) {
    toast('请先选择客户', 'error');
    return;
  }
  const files = Array.from(fileList || []).filter(file => file && file.type && file.type.startsWith('image/'));
  if (!files.length) {
    toast('请选择图片文件', 'error');
    return;
  }
  let added = 0;
  let skipped = 0;
  let failed = 0;
  let uploadFailed = 0;
  const addedRecords = [];
  for (const file of files) {
    if (file.size > 20 * 1024 * 1024) {
      skipped++;
      continue;
    }
    const record = {
      id: uid(),
      customerId: customer.id,
      name: file.name || '粘贴图片.png',
      type: file.type || 'image/png',
      size: file.size,
      caption: '',
      createdAt: new Date().toISOString(),
      blob: file
    };
    try {
      await DB.putImage(record);
      added++;
      addedRecords.push(record);
      try {
        record.path = await CLOUD.uploadImage(record);
        record.updatedAt = new Date().toISOString();
        await DB.putImage(record);
      } catch (upErr) {
        uploadFailed++;
      }
    } catch (err) {
      failed++;
    }
  }
  if (state.selectedId !== customer.id) return;
  try {
    const imgs = await DB.getImages(customer.id);
    state.images = imgs.sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
    state.imagesError = '';
  } catch (err) {
    if (Array.isArray(state.images)) state.images.push(...addedRecords);
  }
  renderDetailOnly();
  const parts = [];
  if (added) parts.push(`已添加 ${added} 张图片`);
  if (skipped) parts.push(`${skipped} 张超过 20MB 已跳过`);
  if (failed) parts.push(`${failed} 张保存失败`);
  if (uploadFailed) parts.push(`${uploadFailed} 张尚未上传到仓库，可稍后在云端设置里重试`);
  toast(parts.join('，') || '图片添加失败', added ? 'ok' : 'error');
}

async function saveCaption(imageId, value) {
  if (!ensureWritable()) return;
  if (!Array.isArray(state.images)) return;
  const img = state.images.find(item => item.id === imageId);
  if (!img) return;
  const caption = String(value || '').trim();
  if (img.caption === caption) return;
  const old = img.caption;
  img.caption = caption;
  try {
    await DB.putImage(img);
  } catch (err) {
    img.caption = old;
    toast('图片说明保存失败', 'error');
  }
}

async function deleteImage(id) {
  if (!ensureWritable()) return;
  if (!Array.isArray(state.images)) return;
  const img = state.images.find(item => item.id === id);
  if (!img) return;
  const label = img.caption ? `「${esc(img.caption)}」` : '这张图片';
  const ok = await confirmDialog({
    title: '删除图片',
    message: `确定删除${label}吗？<br><br>删除后无法恢复。`,
    confirmText: '删除图片'
  });
  if (!ok) return;
  const remotePath = img.path;
  try {
    await DB.deleteImage(id);
  } catch (err) {
    toast('图片删除失败，请重试', 'error');
    return;
  }
  if (remotePath) CLOUD.deleteFile(remotePath).catch(() => {});
  revokeImageUrl(id);
  state.images = state.images.filter(item => item.id !== id);
  if (lightboxEl) {
    if (!state.images.length) {
      closeLightbox();
    } else {
      lightboxIndex = Math.min(lightboxIndex, state.images.length - 1);
      renderLightbox();
    }
  }
  renderDetailOnly();
  toast('图片已删除');
}

function openLightbox(imageId) {
  const images = Array.isArray(state.images) ? state.images : [];
  const idx = images.findIndex(img => img.id === imageId);
  if (idx < 0) return;
  lightboxIndex = idx;
  if (!lightboxEl) {
    lightboxEl = document.createElement('div');
    lightboxEl.className = 'lightbox';
    lightboxEl.addEventListener('click', onLightboxClick);
    document.getElementById('lightboxRoot').appendChild(lightboxEl);
    document.body.classList.add('modal-open');
  }
  renderLightbox();
}

function onLightboxClick(e) {
  if (e.target === lightboxEl) {
    closeLightbox();
    return;
  }
  if (e.target.closest('[data-lb-close]')) {
    closeLightbox();
    return;
  }
  if (e.target.closest('[data-lb-prev]')) {
    moveLightbox(-1);
    return;
  }
  if (e.target.closest('[data-lb-next]')) {
    moveLightbox(1);
    return;
  }
  if (e.target.closest('[data-lb-delete]')) {
    const img = (state.images || [])[lightboxIndex];
    if (img) deleteImage(img.id);
  }
}

function renderLightbox() {
  if (!lightboxEl) return;
  const images = Array.isArray(state.images) ? state.images : [];
  const img = images[lightboxIndex];
  if (!img) {
    closeLightbox();
    return;
  }
  const total = images.length;
  lightboxEl.innerHTML = `
    <div class="lb-top">
      <div class="lb-title">${icon('image', 14)}<span>${esc(img.name || '现场图片')}</span></div>
      <button class="icon-btn lb-close" data-lb-close aria-label="关闭大图">${icon('x', 17)}</button>
    </div>
    <div class="lb-stage">
      ${total > 1 ? `<button class="lb-nav prev" data-lb-prev aria-label="上一张">${icon('chevronLeft', 20)}</button>` : ''}
      <img class="lb-img" src="${imageUrl(img)}" alt="${esc(img.caption || img.name || '现场图片')}">
      ${total > 1 ? `<button class="lb-nav next" data-lb-next aria-label="下一张">${icon('chevronRight', 20)}</button>` : ''}
    </div>
    <div class="lb-bottom">
      <div class="lb-caption ${img.caption ? '' : 'empty'}">${img.caption ? esc(img.caption) : '未填写图片说明'}</div>
      <span class="lb-meta">${lightboxIndex + 1} / ${total}</span>
      <button class="btn btn-sm lb-delete" data-lb-delete>${icon('trash', 13)} 删除</button>
    </div>`;
  const closeBtn = lightboxEl.querySelector('[data-lb-close]');
  if (closeBtn) closeBtn.focus({ preventScroll: true });
}

function moveLightbox(delta) {
  const images = Array.isArray(state.images) ? state.images : [];
  if (!lightboxEl || !images.length) return;
  lightboxIndex = (lightboxIndex + delta + images.length) % images.length;
  renderLightbox();
}

function closeLightbox() {
  if (!lightboxEl) return;
  lightboxEl.remove();
  lightboxEl = null;
  if (!modalStack.length) document.body.classList.remove('modal-open');
}

function addQuickFiles(fileList) {

async function saveQuickNote() {
  if (!quickNoteCtx || quickNoteCtx.qn.saving) return;
  const { entry, qn } = quickNoteCtx;
  syncQuickInputs();
  const textarea = entry.modal.querySelector('#qnContent');
  const content = textarea ? textarea.value.trim() : '';
  if (!content && !qn.files.length) {
    toast('先写一句，或粘贴一张截图', 'info');
    if (textarea) textarea.focus();
    return;
  }
  let createdCustomer = false;
  if (qn.kind === 'customer') {
    if (!qn.companyName.trim()) {
      toast('请输入公司名称，或选择已有客户', 'info');
      const input = entry.modal.querySelector('#qnCompany');
      if (input) input.focus();
      return;
    }
    try {
      const resolved = await ensureCustomerForName(qn.companyName);
      qn.customerId = resolved ? resolved.customerId : '';
      qn.companyName = resolved ? resolved.companyName : qn.companyName.trim();
      createdCustomer = !!(resolved && resolved.created);
    } catch (err) {
      toast('客户关联失败，请重试', 'error');
      return;
    }
  }
  const saveBtn = entry.modal.querySelector('#qnSaveBtn');
  const oldText = saveBtn.innerHTML;
  qn.saving = true;
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner" style="width:13px;height:13px"></span> 保存中…';
  const now = new Date().toISOString();
  const note = normalizeNote({
    id: uid(),
    kind: qn.kind,
    content,
    customerId: qn.customerId,
    companyName: qn.companyName,
    dueDate: qn.kind === 'todo' ? qn.dueDate : '',
    tags: qn.tags,
    createdAt: now,
    updatedAt: now
  });
  try {
    await DB.putNote(note);
    const records = [];
    let failedImages = 0;
    for (const item of qn.files) {
      const rec = {
        id: uid(),
        noteId: note.id,
        customerId: '',
        name: item.file.name || '截图.png',
        type: item.file.type || 'image/png',
        size: item.file.size,
        caption: '',
        createdAt: now,
        blob: item.file
      };
      try {
        await DB.putImage(rec);
        records.push(rec);
        try {
          rec.path = await CLOUD.uploadImage(rec);
          rec.updatedAt = new Date().toISOString();
          await DB.putImage(rec);
        } catch (upErr) {
          failedImages++;
        }
      } catch (e) {
        failedImages++;
      }
    }
    state.notes.unshift(note);
    sortNotes();
    state.noteImages.push(...records);
    qn.files.forEach(item => URL.revokeObjectURL(item.url));
    qn.files = [];
    qn.saved++;
    if (textarea) textarea.value = '';
    renderQuickImages();
    const savedEl = entry.modal.querySelector('#qnSaved');
    if (savedEl) {
      savedEl.hidden = false;
      savedEl.textContent = `已记录 ${qn.saved} 条，可以继续写`;
    }
    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = oldText; }
    qn.saving = false;
    if (textarea) textarea.focus();
    renderApp();
    const tip = createdCustomer ? `已记下，并新建线索客户「${qn.companyName}」` : '已记下';
    toast(failedImages ? `${tip}，${failedImages} 张图片保存失败` : tip, failedImages ? 'info' : 'ok');
  } catch (err) {
    qn.saving = false;
    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = oldText; }
    toast('保存失败：' + (err.message || '浏览器存储异常'), 'error');
  }
}

  const pendingFiles = editorCtx.pending ? editorCtx.pending.slice() : [];

      const resolved = await ensureCustomerForName(draft.companyName);
      if (resolved) { draft.customerId = resolved.customerId; draft.companyName = resolved.companyName; }
    } catch (err) {
      toast('客户关联失败，请重试', 'error');
      return;
    }
  }
  const updated = normalizeNote(Object.assign({}, note, {
    kind: draft.kind,
    content,
    customerId: draft.kind === 'customer' ? draft.customerId : '',
    companyName: draft.kind === 'customer' ? draft.companyName.trim() : '',
    dueDate: draft.kind === 'todo' ? draft.dueDate : '',
    tags: draft.tags,
    updatedAt: new Date().toISOString()
  }));
  const btn = entry.modal.querySelector('#editorSaveBtn');
  const old = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:13px;height:13px"></span> 保存中…';
  try {
    await DB.putNote(updated);
    replaceNoteState(updated);
    if (pendingFiles.length) {
      const ts = new Date().toISOString();
      for (const f of pendingFiles) {
        const rec = {
          id: uid(),
          noteId: updated.id,
          customerId: updated.kind === 'customer' ? updated.customerId : '',
          name: f.file.name || '截图.png',
          type: f.file.type || 'image/png',
          size: f.file.size,
          caption: '',
          createdAt: ts,
          blob: f.file
        };
        await DB.putImage(rec);
        rec.path = await CLOUD.uploadImage(rec);
        rec.updatedAt = new Date().toISOString();
        await DB.putImage(rec);
        state.noteImages.push(rec);
        state.imagesUpdatedAt = Date.now();
        try { URL.revokeObjectURL(f.objectUrl); } catch (e) {}
      }
      editorCtx.pending = [];
    }
    entry.close();
    renderApp();
    toast('记录已保存' + (pendingFiles.length ? `，并上传 ${pendingFiles.length} 张图片` : ''));
  } catch (err) {
    btn.disabled = false;
    btn.innerHTML = old;
    toast('保存失败：' + (err.message || '浏览器存储异常'), 'error');
  }
}

async function deleteNote(id) {
  if (!ensureWritable()) return;
  const note = state.notes.find(n => n.id === id);
  if (!note) return false;
  const imgs = noteImagesOf(id);
  const ok = await confirmDialog({
    title: '删除这条记录',
    message: `确定删除 ${esc(fmtDateTime(note.createdAt))} 的这条记录吗？${imgs.length ? `<br><br>它附带的 <strong>${imgs.length}</strong> 张图片也会一起删除。` : ''}<br><br>删除后无法恢复。`,
    confirmText: '删除记录'
  });
  if (!ok) return false;
  try {
    await DB.deleteNote(id);
  } catch (err) {
    toast('删除失败，请重试', 'error');
    return false;
  }
  imgs.forEach(img => revokeImageUrl(img.id));
  state.notes = state.notes.filter(n => n.id !== id);
  state.noteImages = state.noteImages.filter(img => img.noteId !== id);
  state.selectedNoteIds.delete(id);
  renderApp();
  toast('记录已删除');
  return true;
}

function openNoteImage(imageId) {
  const img = state.noteImages.find(item => item.id === imageId);
  if (!img) return;
  const entry = createModal({
    title: img.name || '随手记图片',
    subtitle: fmtDateTime(img.createdAt),
    body: `<div class="note-image-full"><img src="${imageUrl(img)}" alt="随手记图片"></div>`,
    footer: `<button class="btn btn-secondary" data-modal-close>关闭</button>

async function deleteNoteImage(imageId) {
  if (!ensureWritable()) return;
  const img = state.noteImages.find(item => item.id === imageId);
  if (!img) return false;
  const ok = await confirmDialog({
    title: '删除图片',
    message: '确定删除这张附图吗？<br><br>删除后无法恢复。',
    confirmText: '删除图片'
  });

  const remotePath = img.path;
  try {
    await DB.deleteImage(imageId);
  } catch (err) {
    toast('删除失败，请重试', 'error');
    return false;

  revokeImageUrl(imageId);

}

/* ---------- 汇总视图 ---------- */
function noteMatchesRange(note) {
  const d = localDateOf(note.createdAt);
  if (state.noteRange === 'week') return d >= startOfWeekStr() && d <= todayStr();
  if (state.noteRange === 'month') return d.slice(0, 7) === todayStr().slice(0, 7);
  if (state.noteRange === 'custom') {
    if (state.noteFrom && d < state.noteFrom) return false;
    if (state.noteTo && d > state.noteTo) return false;
  }
  return true;
}

function filteredSummaryNotes() {
  return state.notes.filter(n => n.kind === 'summary' && noteMatchesRange(n) &&
    (state.noteTag === 'all' || n.tags.includes(state.noteTag)))
    .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
}

function visibleSelectedNotes() {
  const list = filteredSummaryNotes();
  return list.filter(n => state.selectedNoteIds.has(n.id));
}

function renderNoteImages(noteId, size) {
  const imgs = noteImagesOf(noteId);
  if (!imgs.length) return '';
  return `<div class="note-imgs ${size === 'sm' ? 'sm' : ''}">${imgs.map(img => `
    <button class="note-img" data-action="view-note-image" data-id="${esc(img.id)}" aria-label="查看图片">

    </button>`).join('')}</div>`;
}

function renderNotesGroups(list) {
  if (!list.length) {
    return `<div class="empty-mini">${icon('search', 24)}当前筛选没有汇总记录。<br><button class="btn btn-secondary btn-sm" style="margin-top:9px" data-action="notes-reset">清空筛选</button></div>`;
  }
  if (state.noteGroup === 'time') {
    const groups = new Map();
    list.forEach(n => {
      const key = localDateOf(n.createdAt);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(n);
    });
    return [...groups.keys()].sort().reverse().map(date => `
      <section class="note-group">
        <div class="note-group-head">
          <span class="note-group-title">${icon('calendar', 13)} ${esc(fmtDate(date, true))}</span>
          <span class="count-pill">${groups.get(date).length} 条</span>
        </div>
        ${groups.get(date).map(renderNoteCard).join('')}
      </section>`).join('');
  }
  const tags = allNoteTags(list);
  const withUntagged = list.some(n => !n.tags.length);
  const groups = tags.map(tag => ({ tag, notes: list.filter(n => n.tags.includes(tag)) }));
  if (withUntagged) groups.push({ tag: '未打标签', notes: list.filter(n => !n.tags.length) });
  return groups.map(group => `
    <section class="note-group">
      <div class="note-group-head">
        <span class="note-group-title">${group.tag === '未打标签' ? icon('inbox', 13) : icon('tag', 13)} ${esc(group.tag === '未打标签' ? group.tag : '#' + group.tag)}</span>
        <span class="count-pill">${group.notes.length} 条</span>
      </div>
      ${group.notes.map(renderNoteCard).join('')}
    </section>`).join('');
}

/* ---------- 汇总合并、导出、打印 ---------- */
function groupSummaryNotes(notes) {
  const map = new Map();
  notes.forEach(n => {
    const primary = n.tags.length ? n.tags[0] : '未打标签';
    if (!map.has(primary)) map.set(primary, []);
    map.get(primary).push(n);
  });
  return [...map.keys()]
    .sort((a, b) => a === '未打标签' ? 1 : b === '未打标签' ? -1 : a.localeCompare(b, 'zh'))
    .map(tag => ({
      tag,
      notes: map.get(tag).slice().sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')))
    }));
}

function buildSummaryMarkdown(title, notes) {
  const groups = groupSummaryNotes(notes);
  const lines = [`# ${title}`, '', `> 生成时间：${fmtDateTime(new Date().toISOString())} · 共 ${notes.length} 条`, ''];
  groups.forEach(group => {
    lines.push(`## ${group.tag === '未打标签' ? '未打标签' : '#' + group.tag}`, '');
    group.notes.forEach(n => {
      lines.push(`### ${fmtDateTime(n.createdAt)} · 来源：${noteSourceLabel(n)}`);
      lines.push(n.content || '（图片记录）');
      if (n.tags.length) lines.push('', `标签：${n.tags.map(t => '#' + t).join(' ')}`);
      const imgs = noteImagesOf(n.id);
      if (imgs.length) {
        const captions = imgs.map(i => i.caption).filter(Boolean);
        lines.push('', `（含 ${imgs.length} 张图片${captions.length ? '：' + captions.join('；') : ''}）`);
      }
      lines.push('');
    });
  });
  return lines.join('\n');
}

async function buildSummaryHtml(title, notes) {
  const imageMap = new Map();
  for (const n of notes) {
    const imgs = noteImagesOf(n.id);
    const arr = [];
    for (const img of imgs) {
      if (!img.blob) continue;
      try { arr.push({ dataUrl: await blobToDataURL(img.blob), caption: img.caption || '' }); } catch (e) { /* ignore */ }
    }
    imageMap.set(n.id, arr);
  }
  const groups = groupSummaryNotes(notes);
  const body = groups.map(group => `
    <section class="grp">
      <h2>${group.tag === '未打标签' ? '未打标签' : '#' + esc(group.tag)}</h2>
      ${group.notes.map(n => `
        <article class="item">
          <div class="meta"><strong>${esc(fmtDateTime(n.createdAt))}</strong> · 来源：${esc(noteSourceLabel(n))}</div>
          <div class="text">${n.content ? esc(n.content) : '（图片记录）'}</div>
          ${n.tags.length ? `<div class="tags">${n.tags.map(t => `<span>#${esc(t)}</span>`).join('')}</div>` : ''}
          ${(imageMap.get(n.id) || []).map(img => `
            <figure><img src="${img.dataUrl}" alt="${esc(img.caption || '附图')}">${img.caption ? `<figcaption>${esc(img.caption)}</figcaption>` : ''}</figure>`).join('')}
        </article>`).join('')}
    </section>`).join('');
  return `<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(title)}</title>
<style>
  @page{margin:18mm}
  *{box-sizing:border-box}
  body{margin:0;padding:34px 30px;background:#fff;color:#1b2622;font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;line-height:1.7;font-size:14px}
  .doc{max-width:780px;margin:0 auto}
  h1{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:#74847e;font-size:12px;margin-bottom:25px;padding-bottom:14px;border-bottom:1px solid #e2e9e5}
  h2{font-size:16px;margin:28px 0 12px;color:#0f766e;border-left:3px solid #0f766e;padding-left:9px}
  .item{padding:12px 0 14px;border-bottom:1px dashed #e2e9e5;break-inside:avoid}
  .meta{font-size:11.5px;color:#74847e;margin-bottom:5px}
  .meta strong{color:#3c4e48;font-weight:600}
  .text{white-space:pre-wrap;overflow-wrap:anywhere}
  .tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
  .tags span{font-size:11px;color:#0f766e;background:#e7f4f1;border-radius:999px;padding:1px 8px}
  figure{margin:10px 0 0}
  figure img{max-width:100%;border-radius:8px;border:1px solid #e2e9e5;display:block}
  figcaption{font-size:11px;color:#74847e;margin-top:4px}
  @media print{body{padding:0} .item{page-break-inside:avoid}}
</style></head><body><div class="doc">
<h1>${esc(title)}</h1>
<div class="sub">共 ${notes.length} 条 · 生成于 ${esc(fmtDateTime(new Date().toISOString()))}</div>
${body}
</div></body></html>`;
}

function renderSummaryPreview(title, notes) {

function safeFileName(name) {
  return String(name || '汇总').replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 60) || '汇总';
}

async function printSummaryDoc(html) {
  const iframe = document.createElement('iframe');
  iframe.setAttribute('aria-hidden', 'true');
  iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(iframe);
  await new Promise(resolve => {
    iframe.onload = resolve;
    iframe.srcdoc = html;
  });
  await new Promise(resolve => setTimeout(resolve, 120));
  try {
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
  } catch (e) { /* ignore */ }
  setTimeout(() => iframe.remove(), 2000);
}

function openSummaryDialog(notes) {
  if (!notes.length) {
    toast('先勾选要合并的记录', 'info');
    return;
  }
  const title = `学习汇总 ${fmtDate(todayStr())}`;
  const entry = createModal({
    title: '汇总预览',
    subtitle: '按每条记录的原始时间和来源保留，不会揉成一段。',
    body: `<label class="field summary-title-field">
        <span>汇总标题</span>
        <input id="summaryTitle" value="${esc(title)}" maxlength="80">

      <button class="btn btn-secondary" id="sumMdBtn">${icon('file', 13)} Markdown</button>
      <button class="btn btn-secondary" id="sumHtmlBtn">${icon('external', 13)} HTML</button>
      <button class="btn btn-primary" id="sumPrintBtn">${icon('printer', 13)} 打印</button>`
  });
  const getTitle = () => {
    const input = entry.modal.querySelector('#summaryTitle');
    return (input && input.value.trim()) || title;
  };
  const titleInput = entry.modal.querySelector('#summaryTitle');
  if (titleInput) {

    });
  }
  entry.modal.querySelector('#sumMdBtn').addEventListener('click', () => {

    downloadFile(`${safeFileName(t)}.md`, buildSummaryMarkdown(t, notes), 'text/markdown;charset=utf-8');

  });
  entry.modal.querySelector('#sumHtmlBtn').addEventListener('click', async () => {
    const btn = entry.modal.querySelector('#sumHtmlBtn');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:12px;height:12px"></span> 生成中…';
    try {
      const t = getTitle();
      const html = await buildSummaryHtml(t, notes);
      downloadFile(`${safeFileName(t)}.html`, html, 'text/html;charset=utf-8');
      toast('HTML 汇总已导出');
    } catch (err) {
      toast('导出失败：' + (err.message || '请重试'), 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = old;
    }

/* ---------- 日历视图 ---------- */
function calendarEventsMap() {
  const map = {};
  const add = (date, item) => {
    if (!date) return;
    if (!map[date]) map[date] = [];
    map[date].push(item);
  };
  state.notes.forEach(n => {
    if (n.kind === 'todo' && n.dueDate) add(n.dueDate, { type: 'todo', note: n });
  });
  state.customers.forEach(c => {
    if (c.nextFollowUp) add(c.nextFollowUp, { type: 'follow', customer: c });
    if (c.sampleDate) add(c.sampleDate, { type: 'sample', customer: c });
  });
  return map;
}

function shiftCalendar(delta) {
  const d = new Date(state.calYear, state.calMonth + delta, 1);
  state.calYear = d.getFullYear();
  state.calMonth = d.getMonth();
  const prefix = `${state.calYear}-${pad2(state.calMonth + 1)}`;
  if (!String(state.calSelected).startsWith(prefix)) state.calSelected = `${prefix}-01`;
  renderApp();
}

function renderCalendarView() {
  const year = state.calYear;
  const month = state.calMonth;
  const events = calendarEventsMap();
  const first = new Date(year, month, 1);
  const offset = (first.getDay() + 6) % 7;
  const totalDays = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let day = 1; day <= totalDays; day++) {
    const ds = `${year}-${pad2(month + 1)}-${pad2(day)}`;
    cells.push({ day, ds, evs: events[ds] || [] });
  }
  while (cells.length % 7 !== 0) cells.push(null);
  const weekNames = ['一', '二', '三', '四', '五', '六', '日'];
  const selectedEvs = events[state.calSelected] || [];
  const monthPrefix = `${year}-${pad2(month + 1)}`;
  const monthCount = Object.keys(events).filter(k => k.startsWith(monthPrefix)).reduce((sum, k) => sum + events[k].length, 0);

  return `<div class="page-head">
    <div>
      <div class="eyebrow">日程</div>
      <h1>日历</h1>
      <div class="page-sub">
        <span>${year}年${month + 1}月</span><span class="dot"></span>
        <span>本月 ${monthCount} 个节点</span><span class="dot"></span>
        <span>只显示有日期的待办、跟进和寄样</span>
      </div>
    </div>
    <div class="page-actions">
      <button class="btn btn-secondary" data-action="quick-note" data-kind="todo">${icon('plus', 14)} 加待办</button>
      <button class="btn btn-primary" data-action="quick-note">${icon('note', 14)} 速记</button>
    </div>
  </div>
  <div class="cal-wrap">
    <section class="panel cal-card">
      <div class="cal-head">
        <div class="cal-month">${year}年${month + 1}月</div>
        <div class="cal-nav">
          <button class="icon-btn" data-action="cal-prev" aria-label="上个月">${icon('chevronLeft', 14)}</button>
          <button class="btn btn-secondary btn-sm" data-action="cal-today">今天</button>
          <button class="icon-btn" data-action="cal-next" aria-label="下个月">${icon('chevronRight', 14)}</button>
        </div>
      </div>
      <div class="cal-grid">
        ${weekNames.map(w => `<div class="cal-wd">${w}</div>`).join('')}
        ${cells.map(cell => {
          if (!cell) return `<div class="cal-day blank"></div>`;
          const types = [...new Set(cell.evs.map(e => e.type))];
          return `<button class="cal-day ${cell.ds === todayStr() ? 'is-today' : ''} ${cell.ds === state.calSelected ? 'is-selected' : ''}" data-action="cal-day" data-date="${cell.ds}" aria-label="${cell.ds}">
            <span class="cal-num">${cell.day}</span>
            <span class="cal-dots">${types.slice(0, 3).map(t => `<span class="cal-dot ${t}"></span>`).join('')}${cell.evs.length > 3 ? `<span class="cal-more">+${cell.evs.length - 3}</span>` : ''}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="cal-legend">
        <span><i class="cal-dot todo"></i>待办</span>
        <span><i class="cal-dot follow"></i>客户跟进</span>
        <span><i class="cal-dot sample"></i>寄样节点</span>
      </div>
    </section>
    <section class="panel cal-day-panel">
      <div class="panel-head">
        <div class="panel-title">${icon('calendar', 15)} ${esc(fmtDate(state.calSelected, true))}</div>
        <span class="section-desc">${selectedEvs.length} 项</span>
      </div>
      <div class="panel-body">${renderCalendarDay(selectedEvs)}</div>
    </section>
  </div>
  ${renderTodoList()}`;
}

/* ==================== 导出 / 导入 ==================== */
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 1500);
}

async function exportJSON(includeImages) {
  const payload = {
    app: 'qingxi-crm',
    version: 2,
    exportedAt: new Date().toISOString(),
    includesImages: !!includeImages,
    customers: state.customers,
    notes: state.notes,
    images: []
  };
  if (includeImages) {
    const allImages = await DB.getAllImages();
    const customerIds = new Set(state.customers.map(c => c.id));
    const noteIds = new Set(state.notes.map(n => n.id));
    for (const img of allImages) {
      const belongs = (img.customerId && customerIds.has(img.customerId)) ||
        (img.noteId && noteIds.has(img.noteId));
      if (!belongs || !img.blob) continue;
      payload.images.push({
        id: img.id,
        customerId: img.customerId || '',
        noteId: img.noteId || '',
        name: img.name || '',
        type: img.type || img.blob.type || '',
        size: img.size || img.blob.size || 0,
        caption: img.caption || '',
        createdAt: img.createdAt || '',
        dataUrl: await blobToDataURL(img.blob)
      });
    }
  }
  downloadFile(
    `清洗剂客户数据_${todayStr()}.json`,
    JSON.stringify(payload, null, 2),
    'application/json;charset=utf-8'
  );
}

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('读取图片失败'));
    reader.readAsDataURL(blob);
  });
}

async function handleImportFile(file) {
  if (!ensureWritable()) return;
  if (!file) return;
  if (file.size > 300 * 1024 * 1024) {
    toast('备份文件超过 300MB，建议拆分或减少图片', 'error');
    return;
  }
  try {
    const text = await readFileText(file);
    const data = JSON.parse(text);
    let rawCustomers;
    if (Array.isArray(data)) rawCustomers = data;
    else if (data && Array.isArray(data.customers)) rawCustomers = data.customers;
    else throw new Error('JSON 中未找到 customers 列表');
    const customers = rawCustomers.map(normalizeCustomer).filter(c => c.company.trim());
    const skipped = rawCustomers.length - customers.length;
    const rawNotes = data && Array.isArray(data.notes) ? data.notes : [];
    const notes = rawNotes.map(normalizeNote);
    const rawImages = data && Array.isArray(data.images) ? data.images : [];
    if (!customers.length && !notes.length && !rawImages.length) {
      throw new Error('备份中没有可导入的客户、速记或图片');
    }
    openImportDialog(customers, notes, rawImages, skipped);
  } catch (err) {
    toast('导入失败：' + (err.message || 'JSON 格式不正确'), 'error');
  }
}

function readFileText(file) {
  if (file.text) return file.text();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(reader.error || new Error('读取文件失败'));
    reader.readAsText(file, 'utf-8');
  });
}
