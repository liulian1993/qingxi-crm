<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f7f5">
<title>净澈 · 清洗剂客户管理</title>
<style>
/* ============ 基础 ============ */
:root{
  --bg:#f3f7f4;
  --surface:#ffffff;
  --surface-2:#f8faf9;
  --surface-3:#eef3f0;
  --line:#e2e9e5;
  --line-strong:#d2ddd7;
  --ink:#14201d;
  --ink-2:#3c4e48;
  --muted:#74847e;
  --faint:#a2afa9;
  --accent:#0f766e;
  --accent-dark:#0b5f59;
  --accent-soft:#e7f4f1;
  --accent-line:#c9e5df;
  --danger:#c74444;
  --danger-dark:#a93434;
  --danger-soft:#fdf0ef;
  --warn:#a06a12;
  --warn-soft:#fdf6e7;
  --ok:#2f7d57;
  --shadow-sm:0 1px 2px rgba(20,32,29,.05);
  --shadow-md:0 10px 30px rgba(20,32,29,.07);
  --shadow-lg:0 24px 70px rgba(12,24,21,.22);
  --radius:18px;
  --topbar-h:63px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 500px at 8% -10%,rgba(15,118,110,.09),transparent 60%),
    radial-gradient(700px 420px at 100% 0%,rgba(120,170,150,.10),transparent 60%),
    radial-gradient(600px 400px at 50% 110%,rgba(15,118,110,.05),transparent 70%);
}
body.modal-open{overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
a{color:var(--accent-dark);text-decoration:none}
a:hover{text-decoration:underline}
svg{display:block;flex:none}
[hidden]{display:none!important}
::selection{background:rgba(15,118,110,.16)}
:focus-visible{outline:2px solid rgba(15,118,110,.55);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* 滚动条 */
*{scrollbar-width:thin;scrollbar-color:#cbd7d1 transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:#cfdad4;border-radius:99px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#b8c8c0;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(243,247,244,.86);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(226,233,229,.9);
}
.topbar-inner{
  max-width:1460px;margin:0 auto;padding:11px 22px;
  display:flex;align-items:center;gap:22px;min-height:var(--topbar-h);
}
.brand{
  display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;
  cursor:pointer;text-align:left;border-radius:10px;
}
.brand-mark{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,#159185 0%,#0d6f67 55%,#08514b 100%);
  box-shadow:0 7px 16px rgba(13,111,103,.25),inset 0 1px 0 rgba(255,255,255,.2);
}
.brand-text strong{display:block;font-size:16px;letter-spacing:.06em;line-height:1.2}
.brand-text small{display:block;margin-top:2px;color:var(--muted);font-size:10.5px;letter-spacing:.04em}
.tabs{display:flex;background:var(--surface-3);padding:3px;border-radius:11px;gap:2px}
.tab{
  border:0;background:transparent;padding:7px 18px;border-radius:8px;cursor:pointer;
  font-size:13px;color:var(--muted);font-weight:500;transition:.16s;
}
.tab:hover{color:var(--ink-2)}
.tab.is-active{background:#fff;color:var(--ink);font-weight:650;box-shadow:var(--shadow-sm)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:9px}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:36px;padding:0 13px;border-radius:10px;border:1px solid transparent;
  font-size:13px;font-weight:550;line-height:1;cursor:pointer;white-space:nowrap;
  transition:background .16s,border-color .16s,color .16s,transform .16s,box-shadow .16s;
  -webkit-user-select:none;user-select:none;
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 5px 12px rgba(15,118,110,.18)}
.btn-primary:hover{background:var(--accent-dark);box-shadow:0 7px 16px rgba(15,118,110,.24)}
.btn-secondary{background:#fff;border-color:var(--line-strong);color:var(--ink-2)}
.btn-secondary:hover{border-color:#b9c9c1;background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-3);color:var(--ink-2)}
.btn-danger{background:#fff;border-color:#efc7c3;color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft);border-color:#e5a9a3}
.btn-danger-solid{background:var(--danger);color:#fff}
.btn-danger-solid:hover{background:var(--danger-dark)}
.btn-sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn-lg{height:42px;padding:0 18px;font-size:13.5px;border-radius:11px}
.icon-btn{
  width:32px;height:32px;border:1px solid transparent;background:transparent;border-radius:8px;
  display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);transition:.15s;padding:0;
}
.icon-btn:hover{background:var(--surface-3);color:var(--ink-2)}
.icon-btn.sm{width:26px;height:26px;border-radius:7px}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.link-btn{border:0;background:none;padding:0;color:var(--accent-dark);font-size:12.5px;cursor:pointer;font-weight:550}
.link-btn:hover{text-decoration:underline}
.link-btn.danger{color:var(--danger)}

/* 下拉菜单 */
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer}
.menu>summary::-webkit-details-marker{display:none}
.menu[open]>summary{background:var(--surface-2);border-color:#b9c9c1}
.menu-panel{
  position:absolute;right:0;top:calc(100% + 8px);width:246px;z-index:60;
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;
  box-shadow:0 18px 50px rgba(20,32,29,.14);animation:popIn .14s ease-out;
}
.menu-label{padding:7px 10px 4px;font-size:10.5px;color:var(--faint);letter-spacing:.08em;font-weight:650}
.menu-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:0;border-radius:8px;
  background:none;text-align:left;font-size:12.5px;color:var(--ink-2);cursor:pointer;
}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger:hover{background:var(--danger-soft)}
.menu-item svg{color:var(--faint)}
.menu-item.danger svg{color:var(--danger)}
.menu-sep{height:1px;background:var(--line);margin:5px 7px}

/* ============ 主区域 ============ */
main{max-width:1460px;width:100%;margin:0 auto;padding:20px 22px 34px}

/* ============ 概览 ============ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:6px 0 20px}
.eyebrow{
  display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;
  letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-bottom:7px;
}
.eyebrow::before{content:"";width:18px;height:1.5px;background:var(--accent);border-radius:2px;opacity:.7}
h1{font-size:30px;line-height:1.2;letter-spacing:-.025em;font-weight:700}
.page-sub{color:var(--muted);font-size:12.5px;margin-top:7px;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center}
.page-sub .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

.banner{
  display:flex;align-items:center;gap:9px;padding:10px 14px;margin-bottom:16px;
  border-radius:12px;background:var(--warn-soft);border:1px solid #f0e2c2;
  color:#83580f;font-size:12.5px;line-height:1.5;
}
.banner svg{color:#b4832b}
.banner .btn{margin-left:auto}
.banner.danger{background:var(--danger-soft);border-color:#f3d2cf;color:#9b3a3a}
.banner.danger svg{color:#c05555}

.stat-grid{display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:13px}
.stat-card{
  position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:19px 20px;box-shadow:var(--shadow-sm);min-height:128px;
  width:100%;text-align:left;font-family:inherit;font-size:14px;color:var(--ink);
}
button.stat-card{appearance:none}
.stat-card.primary{
  border:0;color:#fff;background:
    radial-gradient(120% 150% at 100% 0%,#1a9a8d 0%,#0d756c 42%,#07524b 100%);
  box-shadow:0 14px 34px rgba(9,86,79,.22);
}
.stat-card.primary::after{
  content:"";position:absolute;width:180px;height:180px;right:-55px;bottom:-80px;
  border-radius:50%;border:28px solid rgba(255,255,255,.07);
}
.stat-card.primary::before{
  content:"";position:absolute;width:100px;height:100px;right:26px;top:-52px;
  border-radius:50%;background:rgba(255,255,255,.055);
}
.stat-card.link{cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.stat-card.link:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--line-strong)}
.stat-top{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-weight:550}
.primary .stat-top{color:rgba(255,255,255,.72)}
.stat-num{font-size:40px;line-height:1;font-weight:700;letter-spacing:-.04em;margin-top:14px;font-variant-numeric:tabular-nums}
.stat-num small{font-size:12px;font-weight:500;letter-spacing:0;margin-left:5px;color:var(--muted)}
.primary .stat-num small{color:rgba(255,255,255,.6)}
.stat-foot{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px;color:var(--muted)}
.primary .stat-foot{color:rgba(255,255,255,.62)}
.stat-icon{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);margin-bottom:10px;
}
.primary .stat-icon{background:rgba(255,255,255,.13);color:#fff;margin-bottom:0;position:absolute;right:18px;top:18px}
.stat-card.warn .stat-icon{background:var(--warn-soft);color:var(--warn)}
.stat-card.danger .stat-icon{background:var(--danger-soft);color:var(--danger)}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-title{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.section-title .count-pill{
  font-size:11px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);
  padding:1px 7px;border-radius:999px;
}
.section-desc{font-size:11.5px;color:var(--faint)}
.stage-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:9px}
.stage-tile{
  text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 12px 11px;
  cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;box-shadow:var(--shadow-sm);
}
.stage-tile:hover{transform:translateY(-2px);border-color:var(--line-strong);box-shadow:var(--shadow-md)}
.stage-tile .st-name{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.stage-tile .st-num{font-size:23px;font-weight:700;line-height:1;margin-top:9px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stage-tile .st-num.zero{color:var(--faint);font-weight:600}

.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tone-slate{color:#64748b;background:#f1f5f9}
.tone-blue{color:#2563eb;background:#eef4ff}
.tone-teal{color:#0d9488;background:#e8f7f4}
.tone-violet{color:#7c3aed;background:#f5f1ff}
.tone-amber{color:#b45309;background:#fff7e8}
.tone-orange{color:#c2410c;background:#fff2ea}
.tone-green{color:#15803d;background:#eefaf1}
.tone-gray{color:#6b7280;background:#f3f4f6}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:999px;
  font-size:10.5px;font-weight:650;line-height:1.5;white-space:nowrap;
}
.badge .dot{width:5px;height:5px}

.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 17px;border-bottom:1px solid var(--line)}
.panel-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650}
.panel-title .count-pill{font-size:10.5px;font-weight:650;color:var(--muted);background:var(--surface-2);padding:1px 7px;border-radius:999px}
.panel-body{padding:7px}
.follow-row{
  display:flex;align-items:center;gap:11px;width:100%;padding:10px;border:0;border-radius:10px;
  background:transparent;text-align:left;cursor:pointer;transition:background .14s;
}
.follow-row:hover{background:var(--surface-2)}
.avatar{
  width:37px;height:37px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#eaf6f3,#dff0ec);color:var(--accent-dark);
  font-size:13px;font-weight:700;letter-spacing:.02em;
}
.avatar.sample{background:linear-gradient(145deg,#f4efe0,#eee6d1);color:#8a6a24}
.follow-main{flex:1;min-width:0}
.follow-name{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.follow-sub{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.follow-side{display:flex;align-items:center;gap:7px;flex:none}
.due-chip{
  font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:6px;
  background:var(--surface-3);color:var(--muted);white-space:nowrap;
}
.due-chip.today{background:var(--warn-soft);color:var(--warn)}
.due-chip.overdue{background:var(--danger-soft);color:var(--danger)}
.empty-mini{padding:28px 16px;text-align:center;color:var(--faint);font-size:12px;line-height:1.7}
.empty-mini svg{margin:0 auto 8px;color:#c3d0ca}

.data-note{
  display:flex;align-items:center;gap:13px;margin-top:18px;padding:15px 17px;
  border:1px dashed var(--line-strong);border-radius:14px;background:rgba(255,255,255,.55);
}
.data-note-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);flex:none}
.data-note-main{flex:1;min-width:0}
.data-note-title{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.data-note-text{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.55}
.data-note .btn{flex:none}

/* 空状态 */
.empty-hero{
  position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:24px;
  padding:48px 24px 42px;text-align:center;box-shadow:var(--shadow-md);
}
.empty-hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(500px 260px at 50% 0%,rgba(15,118,110,.07),transparent 70%);
}
.empty-art{width:148px;height:128px;margin:0 auto 20px;position:relative;z-index:1}
.empty-hero h2{font-size:23px;letter-spacing:-.02em;position:relative;z-index:1}
.empty-hero p{max-width:460px;margin:9px auto 0;color:var(--muted);font-size:13px;line-height:1.75;position:relative;z-index:1}
.empty-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:23px;position:relative;z-index:1}
.empty-hints{
  display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:26px;padding-top:20px;
  border-top:1px solid var(--line);position:relative;z-index:1;
}
.empty-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint)}
.empty-hint svg{color:#9fb5ac}

/* ============ 客户工作区 ============ */
.workspace{
  display:grid;grid-template-columns:368px minmax(0,1fr);gap:15px;
  height:calc(100dvh - var(--topbar-h) - 40px);min-height:500px;
}
.list-pane{
  display:flex;flex-direction:column;min-height:0;overflow:hidden;background:#fff;
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);
}
.list-head{padding:13px 13px 9px;border-bottom:1px solid var(--line);flex:none}
.search-box{position:relative;display:flex;align-items:center}
.search-box>svg{position:absolute;left:11px;color:var(--faint);pointer-events:none}
.search-box input{
  width:100%;height:38px;padding:0 33px 0 34px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface-2);outline:none;font-size:12.5px;transition:.16s;
}
.search-box input::placeholder{color:var(--faint)}
.search-box input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(15,118,110,.09)}
.search-clear{
  position:absolute;right:5px;width:26px;height:26px;border:0;border-radius:7px;background:transparent;
  color:var(--faint);display:grid;place-items:center;cursor:pointer;
}
.search-clear:hover{background:var(--surface-3);color:var(--ink-2)}
.chips{display:flex;gap:5px;overflow-x:auto;padding:9px 1px 1px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid transparent;background:var(--surface-2);color:var(--muted);
  border-radius:999px;padding:4px 9px;font-size:11px;font-weight:550;cursor:pointer;transition:.14s;white-space:nowrap;
}
.chip:hover{background:var(--surface-3);color:var(--ink-2)}
.chip.is-active{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--accent-line);font-weight:650}
.chip .chip-n{color:var(--faint);margin-left:3px;font-size:10px}
.chip.is-active .chip-n{color:var(--accent)}
.list-meta{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 15px;
  border-bottom:1px solid var(--line);font-size:10.5px;color:var(--faint);flex:none;
}
.list-scroll{overflow-y:auto;padding:7px;flex:1;min-height:0;overscroll-behavior:contain}
.cust-item{
  display:block;width:100%;padding:10px 11px;border:1px solid transparent;border-radius:11px;
  background:transparent;text-align:left;cursor:pointer;transition:background .13s,border-color .13s;
  margin-bottom:1px;
}
.cust-item:hover{background:var(--surface-2)}
.cust-item.is-active{background:#f0f8f6;border-color:#d8ece7}
.cust-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cust-name{
  font-size:13px;font-weight:600;line-height:1.4;letter-spacing:-.005em;min-width:0;
  display:flex;align-items:center;gap:5px;
}
.cust-name .name-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust-badge{
  font-size:9.5px;color:#98762e;background:#f8f2e2;border:1px solid #efe4c8;
  padding:0 4px;border-radius:4px;font-weight:600;flex:none;
}
.cust-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--muted)}
.cust-meta .sep{color:var(--line-strong)}
.cust-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.cust-industry{font-size:10.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust-due{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--faint);flex:none}
.cust-due.today{color:var(--warn)}
.cust-due.overdue{color:var(--danger)}
.cust-due svg{opacity:.8}
.list-empty{padding:44px 20px;text-align:center}
.list-empty svg{margin:0 auto 10px;color:#c5d2cc}
.list-empty strong{display:block;font-size:13px;color:var(--ink-2)}
.list-empty p{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.6}
.list-empty .btn{margin-top:14px}

.detail-pane{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;border-radius:var(--radius)}
.detail-shell{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;min-height:100%}
.detail-header{
  padding:20px 22px 17px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#fbfdfc 0%,#fff 100%);position:relative;
}
.detail-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.detail-title{
  font-size:22px;line-height:1.35;font-weight:700;letter-spacing:-.022em;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;outline:none;
}
.detail-title .badge{font-size:10.5px;font-weight:650;padding:3px 8px}
.detail-actions{display:flex;align-items:center;gap:7px;flex:none}
.detail-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 13px;margin-top:7px;font-size:12px;color:var(--muted)}
.detail-meta .m-item{display:inline-flex;align-items:center;gap:5px}
.detail-meta .sep{width:3px;height:3px;border-radius:50%;background:var(--line-strong)}
.contact-strip{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.contact-pill{
  display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:6px 9px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
  font-size:11.5px;color:var(--ink-2);line-height:1.3;
}
a.contact-pill:hover{text-decoration:none;border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-dark)}
.contact-pill svg{color:var(--faint)}
.contact-pill .cp-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:330px}
.contact-pill.empty-pill{color:var(--faint);background:transparent;border-style:dashed}
.copy-btn{
  border:0;background:none;padding:0 0 0 1px;color:var(--faint);cursor:pointer;display:grid;place-items:center;
  border-radius:4px;
}
.copy-btn:hover{color:var(--accent)}
.back-btn{display:none;align-items:center;gap:4px;border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 0;margin-bottom:9px}
.back-btn:hover{color:var(--ink-2)}

.detail-body{padding:14px}
.card{
  background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px 17px;
  margin-bottom:12px;transition:border-color .16s,background .16s;
}
.card:last-child{margin-bottom:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.card-title{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:650}
.card-title .count-pill{font-size:10px;font-weight:650;color:var(--muted);background:var(--surface-2);padding:1px 6px;border-radius:999px}
.card-sub{font-size:10.5px;color:var(--faint);display:flex;align-items:center;gap:5px}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.kpi-label{font-size:10.5px;color:var(--faint);display:flex;align-items:center;gap:5px}
.kpi-value{margin-top:6px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:20px}
.kpi-value .date{font-variant-numeric:tabular-nums}
.kpi-value .muted{font-weight:400;color:var(--faint);font-size:11.5px}
.notes-block{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fcfbf6;border:1px solid #eee9d9}
.notes-label{font-size:10.5px;color:#a3906a;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.notes-text{font-size:12.5px;line-height:1.65;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.notes-text.empty{color:var(--faint)}

.fu-form{display:grid;grid-template-columns:128px 96px minmax(120px,1fr) auto;gap:7px;margin:13px 0 4px}
.fu-form input,.fu-form select{
  height:35px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);
  padding:0 9px;font-size:12px;outline:none;min-width:0;transition:.15s;
}
.fu-form input:focus,.fu-form select:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(15,118,110,.08)}
.fu-form input::placeholder{color:var(--faint)}
.fu-form .btn{height:35px;border-radius:9px;padding:0 12px;font-size:12px}

.timeline{position:relative;margin-top:11px;padding-left:17px}
.timeline::before{content:"";position:absolute;left:4px;top:9px;bottom:8px;width:1px;background:var(--line)}
.tl-item{position:relative;padding:8px 2px 8px 5px}
.tl-item::before{
  content:"";position:absolute;left:-17px;top:14px;width:7px;height:7px;border-radius:50%;
  background:#fff;border:2px solid #8cc6bb;
}
.tl-item:first-child::before{border-color:var(--accent);background:var(--accent-soft)}
.tl-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:20px}
.tl-date{font-size:11.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tl-method{font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent-dark)}
.tl-del{opacity:0;margin-left:auto;transition:.15s}
.tl-item:hover .tl-del,.tl-item:focus-within .tl-del{opacity:1}
.tl-text{font-size:12.5px;line-height:1.65;color:var(--ink-2);margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.tl-empty{padding:16px 0 6px;text-align:center;font-size:11.5px;color:var(--faint)}

.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.spec{background:#fff;padding:10px 13px;min-width:0}
.spec.full{grid-column:1/-1}
.spec-label{font-size:10.5px;color:var(--faint);margin-bottom:4px;display:flex;align-items:center;gap:5px}
.spec-value{font-size:12.5px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.spec-value.empty{color:#b7c2bd}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.info{background:#fff;padding:10px 13px;min-width:0}
.info.full{grid-column:1/-1}
.info-label{font-size:10.5px;color:var(--faint);margin-bottom:4px}
.info-value{font-size:12.5px;color:var(--ink-2);line-height:1.55;overflow-wrap:anywhere}
.info-value.empty{color:#b7c2bd}
.info-value a{color:var(--accent-dark)}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:9px}
.thumb{position:relative;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface-2);min-width:0}
.thumb-btn{border:0;background:var(--surface-3);padding:0;display:block;width:100%;cursor:zoom-in;position:relative}
.thumb-btn img{display:block;width:100%;height:104px;object-fit:cover;transition:transform .3s}
.thumb-btn:hover img{transform:scale(1.035)}
.thumb-btn::after{
  content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 65%,rgba(9,28,25,.12));
  opacity:0;transition:.2s;
}
.thumb-btn:hover::after{opacity:1}
.thumb-bar{display:flex;align-items:center;gap:2px;padding:4px 5px;background:#fff}
.thumb-caption{
  flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:5px;
  font-size:10.5px;line-height:1.4;padding:3px 4px;outline:none;color:var(--ink-2);
}
.thumb-caption::placeholder{color:var(--faint)}
.thumb-caption:hover{background:var(--surface-2)}
.thumb-caption:focus{background:#fff;border-color:var(--accent-line);box-shadow:0 0 0 2px rgba(15,118,110,.06)}
.thumb-del{opacity:.55}
.thumb:hover .thumb-del{opacity:1}
.upload-tile{
  min-height:142px;border:1.5px dashed var(--line-strong);border-radius:11px;background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;
  color:var(--muted);font-size:11.5px;transition:.16s;padding:10px;text-align:center;
}
.upload-tile:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft)}
.upload-tile svg{color:#94ada4}
.upload-tile:hover svg{color:var(--accent)}
.upload-tile small{font-size:9.5px;color:var(--faint)}
.drop-hint{margin-top:9px;display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--faint)}
.drop-hint kbd{
  font-family:inherit;font-size:9.5px;background:#fff;border:1px solid var(--line-strong);
  border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);
}
.card.dragover{border-color:var(--accent);background:#f7fcfb;box-shadow:inset 0 0 0 2px rgba(15,118,110,.08)}
.gallery-loading{display:flex;align-items:center;gap:8px;padding:8px 2px 4px;font-size:11.5px;color:var(--faint)}
.spinner{
  width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;flex:none;
}

.detail-placeholder{display:grid;place-items:center;min-height:100%;padding:50px 24px;text-align:center}
.detail-placeholder-inner{max-width:340px}
.detail-placeholder-art{color:#c6d3cd;margin:0 auto 16px}
.detail-placeholder h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
.detail-placeholder p{font-size:12px;color:var(--muted);line-height:1.7;margin-top:7px}
.detail-placeholder .btn{margin-top:17px}

/* ============ 模态框 ============ */
.modal-overlay{
  position:fixed;inset:0;z-index:130;display:flex;align-items:center;justify-content:center;
  padding:22px;background:rgba(10,24,21,.46);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  animation:fadeIn .16s ease-out;
}
.modal{
  width:min(860px,100%);max-height:calc(100dvh - 44px);display:flex;flex-direction:column;
  background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;
  animation:modalIn .2s cubic-bezier(.2,.7,.3,1);
}
.modal.small{width:min(440px,100%)}
.modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:18px 21px 15px;border-bottom:1px solid var(--line);flex:none;
}
.modal-title{font-size:17px;font-weight:700;letter-spacing:-.015em;line-height:1.35}
.modal-sub{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.55}
.modal-body{padding:17px 21px;overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
.modal-foot{
  display:flex;align-items:center;justify-content:flex-end;gap:9px;
  padding:13px 21px;border-top:1px solid var(--line);background:var(--surface-2);flex:none;
}
.modal-foot .foot-note{margin-right:auto;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:5px}

.form-group{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:#fff;overflow:hidden}
.form-group:last-child{margin-bottom:0}
.form-group>summary{
  list-style:none;display:flex;align-items:center;gap:9px;padding:11px 13px;
  background:var(--surface-2);cursor:pointer;font-size:12.5px;font-weight:650;user-select:none;
}
.form-group>summary::-webkit-details-marker{display:none}
.form-group>summary .fg-icon{color:var(--faint)}
.form-group>summary .fg-hint{margin-left:auto;font-size:10.5px;font-weight:400;color:var(--faint);display:flex;align-items:center;gap:5px}
.form-group>summary .chevron{color:var(--faint);transition:transform .18s}
.form-group[open]>summary .chevron{transform:rotate(90deg)}
.form-group-body{display:grid;grid-template-columns:1fr 1fr;gap:11px 13px;padding:13px;border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.field label .req{color:var(--danger);font-weight:700}
.field label .opt{font-size:9.5px;font-weight:400;color:var(--faint)}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
  outline:none;font-size:12.5px;transition:.15s;padding:8px 10px;
}
.field input,.field select{height:36px;padding-top:0;padding-bottom:0}
.field textarea{min-height:66px;resize:vertical;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(15,118,110,.08);
}
.field input::placeholder,.field textarea::placeholder{color:#b0bcb6}
.field input.invalid{border-color:var(--danger);background:#fffafa;box-shadow:0 0 0 3px rgba(199,68,68,.07)}
.form-error{
  display:flex;align-items:center;gap:6px;margin-top:10px;padding:8px 10px;border-radius:8px;
  background:var(--danger-soft);color:var(--danger);font-size:11.5px;
}
.form-hint-bar{
  display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--faint);
  padding:2px 1px 10px;
}

.radio-list{display:flex;flex-direction:column;gap:8px}
.radio-card{
  display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;cursor:pointer;transition:.15s;background:#fff;
}
.radio-card:hover{background:var(--surface-2)}
.radio-card:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-card input{margin:2px 0 0;accent-color:var(--accent);flex:none}
.radio-card strong{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.radio-card span{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.radio-card strong .danger-text{color:var(--danger);font-weight:600}
.confirm-box{display:flex;gap:13px;padding:2px 0}
.confirm-icon{
  width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:var(--danger-soft);color:var(--danger);
}
.confirm-icon.warn{background:var(--warn-soft);color:var(--warn)}
.confirm-text{font-size:12.5px;line-height:1.7;color:var(--ink-2);padding-top:1px}
.confirm-text strong{font-weight:650}
.export-summary{
  display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--ink-2);
}
.export-summary svg{color:var(--accent)}
.export-summary b{font-weight:650}
.check-row{display:flex;align-items:flex-start;gap:9px;margin-top:13px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.check-row input{margin:2px 0 0;accent-color:var(--accent);flex:none}
.check-row .check-title{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.check-row .check-desc{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.export-note{display:flex;gap:6px;align-items:flex-start;font-size:10.5px;color:var(--faint);line-height:1.6;margin-top:11px}

/* ============ 灯箱 ============ */
.lightbox{
  position:fixed;inset:0;z-index:120;background:rgba(7,17,15,.9);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;flex-direction:column;padding:16px;animation:fadeIn .16s;
}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:rgba(255,255,255,.72);font-size:12px;flex:none;padding:2px 2px 10px}
.lb-title{display:flex;align-items:center;gap:8px;min-width:0}
.lb-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.lb-close{color:#fff;background:rgba(255,255,255,.1)}
.lb-close:hover{background:rgba(255,255,255,.18);color:#fff}
.lb-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.lb-img{max-width:min(1100px,92vw);max-height:100%;object-fit:contain;border-radius:9px;box-shadow:0 20px 60px rgba(0,0,0,.4);background:#0d1b17}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;
  display:grid;place-items:center;cursor:pointer;transition:.15s;z-index:2;
}
.lb-nav:hover{background:rgba(255,255,255,.18)}
.lb-nav.prev{left:4px}
.lb-nav.next{right:4px}
.lb-nav:disabled{opacity:.25;cursor:default}
.lb-bottom{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 2px 2px;color:rgba(255,255,255,.82);min-height:44px}
.lb-caption{font-size:12.5px;max-width:60vw;text-align:center;line-height:1.5;overflow-wrap:anywhere}
.lb-caption.empty{color:rgba(255,255,255,.35)}
.lb-delete{color:#ffb4ae;border-color:rgba(255,180,174,.25);background:rgba(255,255,255,.06)}
.lb-delete:hover{background:rgba(255,120,110,.18)}
.lb-meta{font-size:10.5px;color:rgba(255,255,255,.38);font-variant-numeric:tabular-nums}

/* ============ 提示 ============ */
.toasts{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  width:max-content;max-width:calc(100vw - 28px);
}
.toast{
  display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:11px;
  background:#17241f;color:#fff;font-size:12.5px;line-height:1.45;
  box-shadow:0 12px 36px rgba(8,20,17,.3);animation:toastIn .22s cubic-bezier(.2,.8,.3,1);
  max-width:100%;overflow-wrap:anywhere;
}
.toast svg{color:#7fd7bd}
.toast.error{background:#8f3030}
.toast.error svg{color:#ffd0cb}
.toast.info{background:#20302b}
.toast.out{animation:toastOut .2s forwards}

/* ============ 动画 ============ */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ============ 速记 / 汇总 / 日历 / 收件箱 ============ */
main{padding-bottom:88px}
.tab-badge{
  display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;
  padding:0 4px;margin-left:5px;border-radius:999px;background:var(--danger);color:#fff;
  font-size:9.5px;font-weight:700;line-height:1;vertical-align:1px;
}
.tab-badge[hidden]{display:none}
.quick-top{display:inline-flex}
.fab{
  position:fixed;right:26px;bottom:26px;z-index:70;display:flex;align-items:center;gap:8px;
  height:46px;padding:0 17px 0 14px;border:0;border-radius:999px;cursor:pointer;
  background:linear-gradient(145deg,#149486,#0b635c);color:#fff;font-family:inherit;
  font-size:13px;font-weight:650;box-shadow:0 12px 28px rgba(9,86,79,.28);
  transition:transform .18s,box-shadow .18s;
}
.fab:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(9,86,79,.34)}
.fab:active{transform:translateY(0)}
.fab-ico{display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.16)}
.fab-kbd{font:inherit;font-size:10px;background:rgba(255,255,255,.16);border-radius:6px;padding:2px 5px;opacity:.85}

.page-count{
  font-size:13px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:2px 9px;vertical-align:5px;margin-left:4px;
}
.empty-hero.compact{padding:40px 22px 36px;margin-top:8px}
.empty-hero.compact h2{font-size:20px}
.empty-hero.compact p{max-width:560px;margin:8px auto 0}
.empty-line-art{color:#c3d0ca;margin:0 auto 12px}

/* 速记弹窗 */
.qn-kinds{display:flex;flex-wrap:wrap;gap:7px}
.qn-kind{
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  font-family:inherit;font-size:12px;font-weight:550;padding:5px 13px;border-radius:999px;
  cursor:pointer;transition:.15s;
}
.qn-kind:hover{background:var(--surface-3)}
.qn-kind.is-active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-dark);font-weight:650}
.qn-kind-hint{font-size:10.5px;color:var(--faint);margin:7px 0 9px;min-height:15px}
.qn-content-wrap{display:block}
.qn-content{
  width:100%;min-height:88px;border:1px solid var(--line-strong);border-radius:12px;
  padding:11px 12px;font-family:inherit;font-size:13.5px;line-height:1.6;resize:vertical;
  outline:none;background:#fff;color:var(--ink);
}
.qn-content:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.1)}
.qn-attach{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.qn-attach-hint{font-size:10.5px;color:var(--faint)}
.qn-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.qn-img{position:relative;margin:0;width:70px;height:70px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.qn-img img{width:100%;height:100%;object-fit:cover;display:block}
.qn-img-del{
  position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;border:0;
  background:rgba(20,32,29,.72);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;
}
.qn-img-del.static{position:absolute;right:-5px;top:-5px}
.qn-extra{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.qn-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.qn-field.full{grid-column:1/-1}
.qn-field>span{font-size:11px;font-weight:600;color:var(--muted)}
.qn-field input{
  height:34px;border:1px solid var(--line);border-radius:9px;padding:0 10px;
  font-family:inherit;font-size:12.5px;outline:none;background:#fff;color:var(--ink);
}
.qn-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.08)}
.qn-field input.matched{border-color:var(--accent-line);background:#f5fbf9}
.qn-saved{margin-top:9px;font-size:11.5px;color:var(--accent-dark)}

/* 汇总视图 */
.notes-bar{padding:12px 15px;margin-bottom:16px}
.notes-bar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:3px 0}
.notes-bar-row+.notes-bar-row{border-top:1px dashed var(--line);margin-top:4px;padding-top:9px}
.nb-label{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.08em;width:30px;flex:none}
.notes-bar .chips{padding:0;gap:6px}
.notes-custom{display:flex;align-items:center;gap:6px;margin-left:6px}
.notes-custom input{
  height:30px;border:1px solid var(--line);border-radius:8px;padding:0 8px;
  font-family:inherit;font-size:11.5px;color:var(--ink-2);background:#fff;
}
.notes-bar-bottom{padding-top:9px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg-btn{
  border:0;background:transparent;padding:4px 10px;border-radius:6px;font-family:inherit;
  font-size:11.5px;color:var(--muted);cursor:pointer;
}
.seg-btn.is-active{background:#fff;color:var(--accent-dark);font-weight:650;box-shadow:0 1px 2px rgba(20,32,29,.08)}
.notes-select-actions{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.note-sel-count{font-size:11.5px;color:var(--muted)}
.notes-groups{margin-top:4px}
.note-group{margin-top:16px}
.note-group-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.note-group-title{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;color:var(--accent-dark)}
.note-group-head .count-pill{font-size:10px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:1px 7px;border-radius:999px}
.note-card{
  position:relative;display:flex;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:13px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow-sm);
}
.note-card:hover{border-color:var(--line-strong)}
.note-check{padding-top:2px;flex:none}
.note-check input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.note-main{flex:1;min-width:0}
.note-content{font-size:12.8px;line-height:1.65;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.note-content .empty{color:var(--faint)}
.note-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 9px;margin-top:7px;font-size:10.5px;color:var(--faint)}
.note-time,.note-source{display:inline-flex;align-items:center;gap:4px}
.note-tag{
  border:0;background:var(--accent-soft);color:var(--accent-dark);font-family:inherit;
  font-size:9.5px;font-weight:600;line-height:1.5;padding:1px 7px;border-radius:999px;cursor:pointer;
}
.note-tag:hover{background:var(--accent-line)}
.note-ops{display:flex;flex-direction:column;gap:4px;flex:none;opacity:.55;transition:opacity .15s}
.note-card:hover .note-ops{opacity:1}
.note-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note-imgs.sm{margin-top:6px}
.note-img{
  width:62px;height:62px;border-radius:8px;overflow:hidden;border:1px solid var(--line);
  padding:0;background:var(--surface-2);cursor:pointer;
}
.note-imgs.sm .note-img{width:48px;height:48px}
.note-img img{width:100%;height:100%;object-fit:cover;display:block}
.note-img-wrap{position:relative;margin:0}
.note-image-full{display:flex;justify-content:center;background:#0d1512;border-radius:12px;padding:10px}
.note-image-full img{max-width:100%;max-height:70vh;display:block;border-radius:6px}
.editor-images{margin-top:10px}
.editor-imgs-label{font-size:10.5px;color:var(--faint);margin-bottom:5px}
.editor-img-add{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:86px;height:86px;border:1.5px dashed var(--line);border-radius:8px;background:var(--soft);color:var(--faint);vertical-align:top}
.editor-img-add .btn{font-size:11px;padding:3px 8px}
.qn-img-hint{font-size:10px;color:var(--faint)}

/* 汇总预览 */
.summary-title-field{margin-bottom:12px;gap:5px}
.summary-title-field>span{font-size:11px;font-weight:600;color:var(--muted)}
.summary-title-field input{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-family:inherit;font-size:13px}
.summary-preview{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:14px 16px;max-height:48vh;overflow:auto}
.sp-head{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sp-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.sp-sub{font-size:10.5px;color:var(--faint);margin-top:3px}
.sp-section{margin-top:13px}
.sp-section h4{font-size:12.5px;color:var(--accent-dark);margin:0 0 7px;display:flex;align-items:center;gap:7px}
.sp-section h4 span{font-size:9.5px;color:var(--faint);font-weight:500}
.sp-item{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:6px}
.sp-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10px;color:var(--faint);margin-bottom:4px}
.sp-text{font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.sp-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.sp-tags span{font-size:9.5px;color:var(--accent-dark);background:var(--accent-soft);border-radius:999px;padding:1px 7px}

/* 收件箱 */
.inbox-list{display:flex;flex-direction:column;gap:10px}
.inbox-card{padding:13px 14px}
.inbox-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.ib-label{font-size:10.5px;color:var(--faint);margin-right:2px}
.ib-tags{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--faint);margin-left:auto}
.ib-tags input{
  height:28px;border:1px solid var(--line);border-radius:8px;padding:0 8px;
  font-family:inherit;font-size:11px;width:150px;background:#fff;outline:none;
}
.ib-tags input:focus{border-color:var(--accent)}

/* 客户详情随手记 */
.cust-notes{display:flex;flex-direction:column;gap:8px}
.cn-item{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cn-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cn-time{font-size:10px;color:var(--faint)}
.cn-ops{display:flex;gap:2px;opacity:.6}
.cn-item:hover .cn-ops{opacity:1}
.cn-text{font-size:12px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}
.cn-text.empty{color:var(--faint)}

/* 日历 */
.cal-wrap{display:grid;grid-template-columns:1.12fr .88fr;gap:14px;align-items:start}
.cal-card{padding:14px 15px 12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cal-month{font-size:15px;font-weight:700;letter-spacing:-.01em}
.cal-nav{display:flex;align-items:center;gap:5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-wd{text-align:center;font-size:10px;color:var(--faint);padding:3px 0 5px;font-weight:600}
.cal-day{
  position:relative;aspect-ratio:1/.9;min-height:46px;border:1px solid transparent;border-radius:8px;
  background:transparent;cursor:pointer;font-family:inherit;padding:4px 3px;display:flex;
  flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;color:var(--ink-2);
}
.cal-day:hover{background:var(--surface-2);border-color:var(--line)}
.cal-day.blank{pointer-events:none;background:transparent}
.cal-day.is-today{background:var(--accent-soft);color:var(--accent-dark);font-weight:700}
.cal-day.is-selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-num{font-size:11.5px;font-variant-numeric:tabular-nums;line-height:1.4}
.cal-dots{display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap;min-height:7px}
.cal-dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.cal-dot.todo{background:#c2410c}
.cal-dot.follow{background:#0f766e}
.cal-dot.sample{background:#7c3aed}
.cal-more{font-size:8px;color:var(--faint);line-height:1}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:10px;color:var(--faint)}
.cal-legend span{display:inline-flex;align-items:center;gap:4px}
.cal-day-panel .panel-body{padding:8px}
.cal-day-list{display:flex;flex-direction:column;gap:6px}
.cal-item{
  display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:9px;
  border:1px solid var(--line);background:#fff;text-align:left;width:100%;
  font-family:inherit;font-size:12px;color:var(--ink);
}
.cal-item.link{cursor:pointer;transition:background .14s}
.cal-item.link:hover{background:var(--surface-2)}
.cal-item>input[type=checkbox]{margin-top:2px;width:15px;height:15px;accent-color:var(--accent);flex:none}
.cal-item .ci-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ci-title{font-size:12.5px;font-weight:550;white-space:pre-wrap;overflow-wrap:anywhere}
.ci-sub{font-size:10.5px;color:var(--faint);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ci-badge{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;flex:none;margin-top:1px}
.ci-badge.follow{background:var(--accent-soft);color:var(--accent-dark)}
.ci-badge.sample{background:#f5f1ff;color:#6d28d9}
.cal-item.is-done .ci-title{text-decoration:line-through;color:var(--faint)}
.cal-item>svg{color:var(--faint);flex:none;margin-top:3px}
.cal-todo-panel{margin-top:14px}
.todo-row{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:9px}
.todo-row:hover{background:var(--surface-2)}
.todo-row>input{width:15px;height:15px;margin-top:2px;accent-color:var(--accent);flex:none}
.todo-main{flex:1;min-width:0}
.todo-text{font-size:12.5px;line-height:1.5;white-space:pre-wrap}
.todo-sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:10.5px}

/* ============ 响应式 ============ */
@media (max-width:1180px){
  .stage-grid{grid-template-columns:repeat(4,1fr)}
  .stage-tile{padding:11px 12px}
  .stat-grid{grid-template-columns:1.25fr 1fr 1fr}
}
@media (max-width:980px){
  .workspace{grid-template-columns:330px minmax(0,1fr)}
  .stat-grid{grid-template-columns:1fr 1fr}
  .stat-card.primary{grid-column:1/-1}
  .stat-card{min-height:112px}
  .stat-card.primary .stat-icon{position:static;margin-bottom:10px}
  .stat-card.primary{min-height:auto}
  .dash-cols{grid-template-columns:1fr}
  .topbar-inner{gap:16px}
  .tab{padding:7px 13px}
}

  .brand-text strong{font-size:15px}
  .brand-text small{font-size:10px}
  .tabs{order:3;width:100%;background:transparent;padding:0;gap:20px;border-top:1px solid var(--line);padding-top:8px}
  .tab{background:transparent;padding:0 1px 5px;border-radius:0;position:relative;font-size:13px}
  .tab.is-active{background:transparent;box-shadow:none;color:var(--accent-dark)}
  .tab.is-active::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:2px;background:var(--accent);border-radius:2px 2px 0 0}
  .topbar-actions{gap:7px}
  .topbar-actions .btn{padding:0 10px}
  .topbar-actions .btn .btn-label-long{display:none}
  main{padding:16px 15px 28px}
  .workspace{display:block;height:auto;min-height:0}
  .list-pane{min-height:0;max-height:none}
  .list-scroll{overflow:visible;max-height:none}
  .detail-pane{display:none;overflow:visible;border-radius:var(--radius);margin-top:14px;scroll-margin-top:calc(var(--topbar-h) + 10px)}
  .workspace.mobile-detail .detail-pane{display:block}
  .back-btn{display:inline-flex}
  .detail-title-row{flex-direction:column;gap:11px}

  .fu-form{grid-template-columns:1fr 1fr}
  .fu-form .fu-content{grid-column:1/-1}
  .fu-form .btn{grid-column:1/-1;width:100%}
  .contact-pill .cp-text{max-width:calc(100vw - 120px)}
}
@media (max-width:640px){
  :root{--topbar-h:103px}
  .topbar-inner{padding:8px 13px 9px}
  main{padding:13px 12px 26px}
  .brand-text small{display:none}
  .brand-text strong{font-size:14.5px;letter-spacing:.04em}
  .topbar-actions .btn{height:33px;font-size:12px;border-radius:9px}
  .menu-panel{width:230px}
  h1{font-size:25px}
  .stat-grid{gap:9px}
  .stat-card{padding:14px 15px;min-height:104px;border-radius:15px}
  .stat-num{font-size:31px;margin-top:10px}
  .stat-top{font-size:11px}
  .stat-icon{width:28px;height:28px;border-radius:8px;margin-bottom:7px}
  .stage-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .stage-tile{padding:11px 12px}
  .stage-tile .st-num{font-size:21px;margin-top:7px}
  .dash-cols{gap:11px}
  .data-note{align-items:flex-start;flex-wrap:wrap}
  .data-note .btn{margin-left:49px}
  .empty-hero{padding:34px 18px 30px;border-radius:20px}
  .empty-art{width:124px;height:106px}
  .empty-hero h2{font-size:20px}
  .empty-hero p{font-size:12px}
  .empty-hints{gap:10px 14px}
  .detail-header{padding:15px 15px 14px}
  .detail-title{font-size:19px}
  .detail-body{padding:9px}
  .card{padding:14px;border-radius:13px;margin-bottom:9px}
  .detail-shell{border-radius:15px}
  .contact-strip{gap:6px}
  .contact-pill{padding:5px 8px;font-size:11px}
  .contact-pill .cp-text{max-width:calc(100vw - 100px)}
  .spec-grid,.info-grid{grid-template-columns:1fr}
  .spec.full,.info.full{grid-column:auto}
  .kpi-grid{grid-template-columns:1fr}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .thumb-btn img{height:96px}
  .upload-tile{min-height:135px}
  .modal-overlay{padding:0;align-items:flex-end}
  .modal{width:100%;max-height:93dvh;border-radius:18px 18px 0 0;animation:sheetIn .22s cubic-bezier(.2,.8,.3,1)}
  .modal.small{border-radius:18px 18px 0 0}
  .modal-head{padding:15px 16px 12px}
  .modal-title{font-size:16px}
  .modal-body{padding:14px 16px}
  .modal-foot{padding:11px 16px calc(11px + env(safe-area-inset-bottom))}
  .modal-foot .foot-note{display:none}
  .form-group-body{grid-template-columns:1fr;gap:10px;padding:12px}
  .field.full{grid-column:auto}
  .btn-lg{height:40px}
  .lb-nav{width:36px;height:36px}
  .lb-caption{max-width:70vw}
  .toasts{bottom:16px}
}

/* 新功能响应式（放在最后确保覆盖） */
@media (max-width:1180px){
  .cal-wrap{grid-template-columns:1fr 1fr}
}
@media (max-width:980px){
  .cal-wrap{grid-template-columns:1fr}
}
@media (max-width:860px){
  .quick-top{display:none}
  .fab{right:13px;bottom:calc(13px + env(safe-area-inset-bottom));height:48px;padding:0 20px 0 16px;font-size:13.5px}
  .fab-kbd{display:none}
  main{padding-bottom:96px}
  .notes-select-actions{width:100%;margin-left:0;justify-content:flex-end}
  .notes-bar-row{gap:7px}
  .note-ops{opacity:1}
  .tabs{gap:15px}
  .tab{white-space:nowrap}
  .qn-extra{grid-template-columns:1fr}

}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* ==================== GitHub 云端同步 ==================== */
.sync-bar{display:flex;align-items:center;gap:9px;padding:7px 16px;font-size:12.5px;border-bottom:1px solid #e6eeea;background:#f6faf8;color:#47615a}
.sync-bar .dot{width:7px;height:7px;border-radius:50%;background:#17a673;flex:0 0 auto}
.sync-bar.ro{background:#fdf7ea;border-bottom-color:#f0e2c4;color:#8a6a22}
.sync-bar.ro .dot{background:#d09a2c}
.sync-bar.err{background:#fdf0ef;border-bottom-color:#f3d2cf;color:#9b3a3a}
.sync-bar.err .dot{background:#c05555}
.sync-bar .spacer{flex:1}
.sync-bar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:7px;padding:2px 8px;font-size:12px;cursor:pointer}
.sync-bar button:hover{background:rgba(0,0,0,.04)}
.gh-form{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.gh-form .full{grid-column:1/-1}
.gh-form label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.gh-form input{width:100%;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff}
.gh-form input:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 2px rgba(15,118,110,.08)}
.gh-note{font-size:12px;line-height:1.65;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.gh-note code{background:#eef4f1;padding:1px 5px;border-radius:5px;font-size:11.5px}
.gh-status{font-size:12.5px;line-height:1.6;padding:9px 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.gh-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.gh-actions .btn{flex:0 0 auto}

<script>
'use strict';

/* ==================== 常量与数据模型 ==================== */
const STAGES = [

  { name: '已联系', tone: 'blue' },
  { name: '需求确认', tone: 'teal' },
  { name: '已寄样', tone: 'violet' },
  { name: '试洗中', tone: 'amber' },
  { name: '报价', tone: 'orange' },
  { name: '成单', tone: 'green' },
  { name: '暂搁置', tone: 'gray' }
];
const SOURCES = ['网销', '展会', '转介绍', '陌生拜访'];
const METHODS = ['电话', '微信', '拜访', '邮件'];

const BASIC_FIELDS = [
  { key: 'contact', label: '联系人', ph: '姓名 / 称呼' },
  { key: 'title', label: '职务', ph: '如：设备主管、工艺工程师' },
  { key: 'phone', label: '电话', ph: '手机或座机', type: 'tel' },
  { key: 'wechat', label: '微信', ph: '微信号' },
  { key: 'email', label: '邮箱', ph: 'name@company.com', type: 'email' },
  { key: 'address', label: '地址', ph: '省 / 市 / 区 + 详细地址', full: true },
  { key: 'website', label: '官网', ph: 'https://', full: true },
  { key: 'industry', label: '行业', ph: '如：低压电器、汽车电子' },
  { key: 'scale', label: '企业规模', ph: '如：200-500 人' },

];

const SPEC_FIELDS = [
  { key: 'sampleStructure', label: '样件结构', ph: '待清洗的工件、管道或设备结构', full: true, textarea: true },
  { key: 'process', label: '制程工艺', ph: '如：SMT、波峰焊、手工焊' },
  { key: 'solderAlloy', label: '焊料 / 合金', ph: '如：SAC305、锡铅焊料' },
  { key: 'contaminant', label: '污染物类型', ph: '如：松香、助焊剂残留、油污' },
  { key: 'currentCleaning', label: '现有清洗方式', ph: '如：人工擦拭、超声波、喷淋', full: true, textarea: true },
  { key: 'cleaningEquipment', label: '清洗设备', ph: '现有设备名称 / 型号，或“无”' },
  { key: 'difficulty', label: '清洗难点', ph: '难触及部位、材质兼容性、干燥要求等', full: true, textarea: true },
  { key: 'cleanlinessStandard', label: '洁净度检测标准', ph: '如：离子污染度、目视标准、客户内控标准', full: true, textarea: true },
  { key: 'currentBrand', label: '现用清洗剂品牌型号', ph: '品牌 + 型号' },
  { key: 'replaceReason', label: '替换原因', ph: '如：清洗不彻底、环保不达标、成本', full: true, textarea: true },
  { key: 'wasteRequirement', label: '废液与环保要求', ph: '废液处理方式、VOC / 排放要求等', full: true, textarea: true }
];

const TEXT_FIELDS = [
  'company', 'contact', 'title', 'phone', 'wechat', 'email', 'address', 'website',
  'industry', 'scale', 'source',
  ...SPEC_FIELDS.map(f => f.key),
  'stage', 'nextFollowUp', 'sampleDate', 'notes'
];

const NOTE_KINDS = [
  { key: 'inbox', label: '未整理', hint: '先存下来，稍后再归类' },
  { key: 'customer', label: '客户', hint: '记到某个客户名下' },
  { key: 'todo', label: '待办', hint: '有日期的事会出现在日历' },
  { key: 'summary', label: '汇总', hint: '碎片学习信息都放这里' }
];
const NOTE_KIND_LABEL = { inbox: '未整理', customer: '客户', todo: '待办', summary: '汇总' };

const DB_NAME = 'qingxi_crm_v1';
const SAMPLE_ID = 'sample-kenengda';

/* ==================== 图标 ==================== */
const ICONS = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.3-3.3"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  trash: '<path d="M4 7h16M9 7V5h6v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/>',
  edit: '<path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="m13.5 6.5 3 3"/>',
  phone: '<path d="M6.3 3.5h3l1.4 4.2-2 1.4a12 12 0 0 0 6.2 6.2l1.4-2 4.2 1.4v3a2 2 0 0 1-2.2 2A16.8 16.8 0 0 1 4.3 5.7a2 2 0 0 1 2-2.2Z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6 8.5-6"/>',
  wechat: '<path d="M8.5 6.5c-3 0-5.5 2-5.5 4.5 0 1.4.8 2.7 2 3.5l-.6 2 2.3-1.1c.6.15 1.2.2 1.8.2"/><path d="M15.5 9.5c-3 0-5.5 2-5.5 4.5s2.5 4.5 5.5 4.5c.7 0 1.3-.1 1.9-.3l2.2 1-.6-1.9c1.2-.8 2-2 2-3.3 0-2.5-2.5-4.5-5.5-4.5Z"/>',
  mapPin: '<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.6"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.5 4 5.6 4 9s-1.4 6.5-4 9c-2.6-2.5-4-5.6-4-9s1.4-6.5 4-9Z"/>',
  user: '<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>',
  building: '<path d="M4 20V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v15M15 9h4a1 1 0 0 1 1 1v10M2 20h20"/><path d="M8 8h3M8 12h3M8 16h3"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/>',
  alert: '<path d="M12 4 2.8 20h18.4L12 4Z"/><path d="M12 9v5M12 17h.01"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/>',
  upload: '<path d="M12 15V3m0 0L8 7m4-4 4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  download: '<path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  database: '<ellipse cx="12" cy="5.5" rx="7" ry="3"/><path d="M5 5.5v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6M5 11.5v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"/>',
  table: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11M15 9v11M3 14.5h18"/>',
  check: '<path d="m5 12.5 4.2 4.2L19 7"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  copy: '<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  chevronRight: '<path d="m9 6 6 6-6 6"/>',
  chevronLeft: '<path d="m15 6-6 6 6 6"/>',
  chevronDown: '<path d="m6 9 6 6 6-6"/>',
  arrowLeft: '<path d="M20 12H4m0 0 6-6m-6 6 6 6"/>',
  arrowRight: '<path d="M4 12h16m0 0-6-6m6 6-6 6"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>',
  inbox: '<path d="M4 5h16l2 10v4H2v-4L4 5Z"/><path d="M2 15h5l2 3h6l2-3h5"/>',
  sparkle: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>',
  activity: '<path d="M3 12h4l2.5-6 4 12 2.5-6h5"/>',
  note: '<path d="M5 3h11l3 3v15H5V3Z"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/>',
  external: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  filter: '<path d="M3 5h18l-7 8v6l-4 2v-8L3 5Z"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 6.3M20 4v7h-7"/>',
  file: '<path d="M6 3h8l4 4v14H6V3Z"/><path d="M14 3v4h4"/>',
  tag: '<path d="M20.5 13.5 13 21a1.7 1.7 0 0 1-2.4 0L3 13.4V3h10.4L21 10.6a1.7 1.7 0 0 1 0 2.9Z"/><circle cx="8.2" cy="8.2" r="1.3"/>',
  printer: '<path d="M7 8V3h10v5"/><rect x="4" y="8" width="16" height="8" rx="2"/><path d="M7 13h10v8H7z"/>',
  droplet: '<path d="M12 3.2c3.35 4 5.85 7 5.85 10.05a5.85 5.85 0 1 1-11.7 0C6.15 10.2 8.65 7.2 12 3.2Z"/>'
};

function icon(name, size = 16, cls = '') {
  const body = ICONS[name] || '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" class="${cls}" aria-hidden="true" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}

/* ==================== 工具函数 ==================== */
function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}
function uid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}
function pad2(n) { return String(n).padStart(2, '0'); }
function todayStr(d = new Date()) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function dateOnly(value) {
  if (!value) return NaN;
  const parts = String(value).split('-').map(Number);
  if (parts.length < 3 || !parts[0] || !parts[1] || !parts[2]) return NaN;
  return Date.UTC(parts[0], parts[1] - 1, parts[2]);
}
const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
function fmtDate(value, withWeekday = false) {
  if (!value) return '';
  const parts = String(value).split('-').map(Number);
  if (parts.length < 3 || !parts[0]) return String(value);
  const base = `${parts[0]}年${parts[1]}月${parts[2]}日`;
  if (!withWeekday) return base;
  const d = new Date(parts[0], parts[1] - 1, parts[2]);
  return `${base} ${WEEKDAYS[d.getDay()]}`;
}
function fmtShortDate(value) {
  if (!value) return '';
  const parts = String(value).split('-').map(Number);
  if (parts.length < 3) return value;
  return `${parts[1]}月${parts[2]}日`;
}
function dueInfo(dateStr) {
  if (!dateStr) return null;
  const target = dateOnly(dateStr);
  if (Number.isNaN(target)) return null;
  const diff = Math.round((target - dateOnly(todayStr())) / 86400000);
  if (diff === 0) return { type: 'today', text: '今天' };
  if (diff < 0) return { type: 'overdue', text: `逾期 ${Math.abs(diff)} 天` };
  if (diff === 1) return { type: 'upcoming', text: '明天' };
  if (diff <= 7) return { type: 'upcoming', text: `${diff} 天后` };
  return { type: 'upcoming', text: fmtShortDate(dateStr) };
}
function stageInfo(name) {
  return STAGES.find(s => s.name === name) || { name: name || '线索', tone: 'slate' };
}
function stageBadge(name) {
  const info = stageInfo(name);
  return `<span class="badge tone-${info.tone}"><span class="dot"></span>${esc(info.name)}</span>`;
}
function initialOf(company) {
  const s = String(company || '').trim();
  return s ? s.slice(0, 1).toUpperCase() : '客';
}
function normalizeUrl(url) {
  const s = String(url || '').trim();
  if (!s) return '';
  if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return s;
  return 'https://' + s;
}
function normalizeCustomer(raw) {
  raw = raw && typeof raw === 'object' ? raw : {};
  const c = {};
  TEXT_FIELDS.forEach(key => {
    const v = raw[key];
    c[key] = v == null ? '' : String(v);
  });
  c.id = raw.id ? String(raw.id) : uid();
  c.createdAt = raw.createdAt || new Date().toISOString();
  c.updatedAt = raw.updatedAt || c.createdAt;
  c.isSample = !!raw.isSample;
  if (!c.stage) c.stage = '线索';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(c.nextFollowUp)) c.nextFollowUp = '';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(c.sampleDate)) c.sampleDate = '';
  c.followUps = Array.isArray(raw.followUps) ? raw.followUps
    .filter(f => f && typeof f === 'object')
    .map(f => ({
      id: f.id ? String(f.id) : uid(),
      date: /^\d{4}-\d{2}-\d{2}$/.test(f.date || '') ? f.date : (f.createdAt ? String(f.createdAt).slice(0, 10) : todayStr()),
      method: f.method ? String(f.method) : '电话',
      content: f.content == null ? '' : String(f.content),
      createdAt: f.createdAt || new Date().toISOString()
    }))
    .filter(f => f.content.trim()) : [];
  return c;
}
function normalizeNote(raw) {
  raw = raw && typeof raw === 'object' ? raw : {};
  const allowed = ['inbox', 'customer', 'todo', 'summary'];
  const kind = allowed.includes(raw.kind) ? raw.kind : 'inbox';
  const note = {
    id: raw.id ? String(raw.id) : uid(),
    kind,
    content: raw.content == null ? '' : String(raw.content).trim(),
    customerId: raw.customerId ? String(raw.customerId) : '',
    companyName: raw.companyName ? String(raw.companyName).trim() : '',
    dueDate: /^\d{4}-\d{2}-\d{2}$/.test(raw.dueDate || '') ? raw.dueDate : '',
    done: !!raw.done,
    tags: Array.isArray(raw.tags) ? dedupeTags(raw.tags) : [],
    createdAt: raw.createdAt || new Date().toISOString(),
    updatedAt: raw.updatedAt || raw.createdAt || new Date().toISOString()
  };
  if (kind !== 'todo') { note.done = false; note.dueDate = ''; }
  if (kind !== 'customer') { note.customerId = ''; note.companyName = ''; }
  return note;
}
function dedupeTags(list) {

  (Array.isArray(list) ? list : []).forEach(item => {
    const tag = String(item == null ? '' : item).replace(/^#/, '').trim();
    if (tag && !out.includes(tag) && out.length < 8) out.push(tag);
  });
  return out;
}
function parseTags(value) {
