      </div>
      <div class="export-note">${icon('info', 12)}
        <span>图片会以 Blob 形式写入 IndexedDB；导入完成后页面会回到概览。</span>
      </div>`,
    footer: `<button class="btn btn-secondary" data-modal-close>取消</button>
      <button class="btn btn-primary" id="importConfirmBtn">${icon('upload', 14)} 开始导入</button>`
  });
  const btn = entry.modal.querySelector('#importConfirmBtn');
  btn.addEventListener('click', async () => {
    const mode = (entry.modal.querySelector('input[name="importMode"]:checked') || {}).value || 'merge';
    if (mode === 'replace') {
      const ok = await confirmDialog({
        title: '覆盖导入确认',
        message: `将先清空本机现有的 <strong>${state.customers.length}</strong> 位客户、<strong>${state.notes.length}</strong> 条速记和全部图片，再导入这份备份。<br><br>此操作无法撤销，建议先导出当前数据。`,
        confirmText: '继续覆盖'
      });
      if (!ok) return;
    }
    const old = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:13px;height:13px"></span> 正在导入…';
    try {
      const allowedCustomerIds = new Set(customers.map(c => c.id));
      const allowedNoteIds = new Set(notes.map(n => n.id));
      if (mode === 'merge') {
        state.customers.forEach(c => allowedCustomerIds.add(c.id));
        state.notes.forEach(n => allowedNoteIds.add(n.id));
      }
      const imageRecords = [];
      let failedImages = 0;
      for (const raw of rawImages) {
        if (!raw || !raw.dataUrl) continue;
        const cid = raw.customerId ? String(raw.customerId) : '';
        const nid = raw.noteId ? String(raw.noteId) : '';
        const allowed = (cid && allowedCustomerIds.has(cid)) || (nid && allowedNoteIds.has(nid));
        if (!allowed) continue;
        try {
          const blob = await dataUrlToBlob(raw.dataUrl);
          imageRecords.push({
            id: raw.id ? String(raw.id) : uid(),
            customerId: cid,
            name: raw.name ? String(raw.name) : '图片',
            type: blob.type || raw.type || 'image/png',
            size: blob.size || raw.size || 0,
            caption: raw.caption ? String(raw.caption) : '',
            createdAt: raw.createdAt || new Date().toISOString(),
            blob
          });
          if (nid) imageRecords[imageRecords.length - 1].noteId = nid;
        } catch (err) {
          failedImages++;
        }
      }
      if (mode === 'replace') {
        await DB.replaceAll(customers, imageRecords, notes);
      } else {
        await DB.putCustomers(customers);
        await DB.putNotes(notes);
        await DB.putImages(imageRecords);
      }
      closeLightbox();
      revokeAllImageUrls();
      await reloadStateFromDB();
      state.selectedId = null;
      state.view = 'dashboard';
      state.mobileDetail = false;
      state.images = null;
      state.imagesError = '';
      state.imagesLoading = false;
      state.selectedNoteIds.clear();
      imagesLoadingFor = null;
      entry.close();
      renderApp();
      toast(`已导入 ${customers.length} 位客户、${notes.length} 条速记${imageRecords.length ? `、${imageRecords.length} 张图片` : ''}${failedImages ? `，${failedImages} 张图片失败` : ''}`);
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = old;
      toast('导入失败：' + (err.message || '请检查文件后重试'), 'error');
    }
  });
}

async function dataUrlToBlob(dataUrl) {
  try {
    const res = await fetch(dataUrl);
    if (!res.ok) throw new Error('fetch failed');
    return await res.blob();
  } catch (e) {
    const match = String(dataUrl || '').match(/^data:([^;,]+)?(;base64)?,([\s\S]*)$/);
    if (!match) throw new Error('图片数据格式不正确');
    const mime = match[1] || 'image/png';
    let bytes;
    if (match[2]) {
      const binary = atob(match[3]);
      const arr = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
      bytes = arr;
    } else {
      bytes = new TextEncoder().encode(decodeURIComponent(match[3]));
    }
    return new Blob([bytes], { type: mime });
  }
}

async function reloadStateFromDB() {
  const list = await DB.getCustomers();
  state.customers = list.map(normalizeCustomer);
  sortCustomers();
  const notes = await DB.getNotes();
  state.notes = notes.map(normalizeNote);
  sortNotes();
  const noteImages = await DB.getAllNoteImages();
  state.noteImages = noteImages.map(img => Object.assign({}, img, { noteId: String(img.noteId || '') }));
  state.selectedNoteIds = new Set([...state.selectedNoteIds].filter(id => state.notes.some(n => n.id === id)));
}

/* ==================== CSV ==================== */
function csvCell(value) {
  return '"' + String(value == null ? '' : value).replace(/"/g, '""') + '"';
}

function exportCSV() {
  if (!state.customers.length) {
    toast('还没有客户数据可以导出', 'info');
    return;
  }
  const header = [
    '公司名称', '联系人', '职务', '电话', '微信', '邮箱', '地址', '官网', '行业', '企业规模', '来源渠道',
    '当前阶段', '下次跟进', '寄样日期',
    ...SPEC_FIELDS.map(f => f.label),
    '备注', '跟进记录', '创建时间', '最近更新'
  ];
  const rows = state.customers.map(c => {
    const followups = [...c.followUps]
      .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) ||
        String(b.createdAt || '').localeCompare(String(a.createdAt || '')))
      .map(f => `${f.date} ${f.method}：${f.content}`)
      .join('\n');
    return [
      c.company, c.contact, c.title, c.phone, c.wechat, c.email, c.address, c.website,
      c.industry, c.scale, c.source, c.stage, c.nextFollowUp, c.sampleDate,
      ...SPEC_FIELDS.map(f => c[f.key]),
      c.notes, followups, c.createdAt, c.updatedAt
    ].map(csvCell).join(',');
  });
  const csv = '\ufeff' + [header.map(csvCell).join(','), ...rows].join('\r\n');
  downloadFile(`清洗剂客户数据_${todayStr()}.csv`, csv, 'text/csv;charset=utf-8');
  toast('CSV 表格已导出');
}

/* ==================== 云端设置 ==================== */
function ensureWritable() {
  if (!state.readonly) return true;
  toast('只读模式：请先在「数据 → 云端设置」中填写 GitHub Token', 'info');
  openCloudSettings();
  return false;
}

function openCloudSettings() {
  if (!CLOUD.cfg) CLOUD.init();
  const cfg = CLOUD.cfg || {};
  const status = !CLOUD.configured()
    ? '尚未连接仓库：当前只读，数据来自本地缓存。'
    : (CLOUD.writable()
      ? `已连接 ${CLOUD.repoLabel()}，可以读写。`
      : `已连接 ${CLOUD.repoLabel()}，但没填 Token：当前只读。`);
  const body = `
    <div class="gh-note" style="margin-bottom:12px">
      数据保存在仓库根目录的 <code>data.json</code>，图片存在 <code>images/</code>。
      Token 只存在这台设备的浏览器 localStorage，不会写进页面或仓库。
      <strong>公开仓库意味着所有能访问到仓库的人都能看到客户资料。</strong>
    </div>
    <div class="gh-form" id="ghForm">
      <div>
        <label for="ghOwner">GitHub 用户名</label>
        <input id="ghOwner" name="owner" placeholder="如 zhangsan" value="${esc(cfg.owner || '')}">
      </div>
      <div>
        <label for="ghRepo">仓库名</label>
        <input id="ghRepo" name="repo" placeholder="如 qingxi-crm" value="${esc(cfg.repo || '')}">
      </div>
      <div>
        <label for="ghBranch">分支</label>
        <input id="ghBranch" name="branch" placeholder="main" value="${esc(cfg.branch || 'main')}">
      </div>
      <div>
        <label for="ghToken">Fine-grained Token</label>
        <input id="ghToken" name="token" type="password" autocomplete="off" placeholder="github_pat_..." value="${esc(CLOUD.token || '')}">
      </div>
      <div class="full gh-status" id="ghStatus">${esc(status)}</div>
      <div class="full gh-actions">
        <button class="btn btn-primary btn-sm" id="ghSave" type="button">保存并连接</button>
        <button class="btn btn-secondary btn-sm" id="ghPull" type="button">从仓库拉取</button>
        <button class="btn btn-secondary btn-sm" id="ghPush" type="button">立即上传本地数据</button>
        <button class="btn btn-secondary btn-sm danger-link" id="ghClear" type="button">清除 Token</button>
      </div>
      <div class="full gh-note">
        首次连接请用「立即上传本地数据」，把本机现有客户、跟进、速记和图片整体推到仓库；
        之后每次修改会自动同步（约 1 秒后写入，commit 带时间戳）。
      </div>
    </div>`;
  const entry = createModal({
    title: '云端设置（GitHub）',
    subtitle: '一个 JSON + 一个图片目录，仓库即数据库',
    body,
    backdropClose: true,
    escapeClose: true
  });
  const modal = entry.modal;
  const readForm = () => ({
    owner: modal.querySelector('#ghOwner').value.trim(),
    repo: modal.querySelector('#ghRepo').value.trim(),
    branch: modal.querySelector('#ghBranch').value.trim() || 'main',
    token: modal.querySelector('#ghToken').value.trim()
  });
  const setStatus = (text, isErr) => {
    const el = modal.querySelector('#ghStatus');
    if (!el) return;
    el.textContent = text;
    el.style.color = isErr ? '#9b3a3a' : '';
  };

  modal.querySelector('#ghSave').addEventListener('click', async () => {
    const v = readForm();
    if (!v.owner || !v.repo) { setStatus('请填写 GitHub 用户名和仓库名', true); return; }
    CLOUD.cfg = { owner: v.owner, repo: v.repo, branch: v.branch };
    CLOUD.token = v.token;
    writeLS(GH_CFG_KEY, JSON.stringify(CLOUD.cfg));
    writeLS(GH_TOKEN_KEY, v.token || null);
    state.readonly = CLOUD.readonly();
    setStatus(CLOUD.writable() ? '已保存，正在读取仓库数据…' : '已保存连接信息（未填 Token，仍为只读）');
    renderSyncBar();
    renderApp();
    if (CLOUD.writable()) {
      try {
        const r = await CLOUD.bootstrap();
        if (r.applied) {
          setStatus('连接成功，已载入仓库数据。');
          renderApp();
          toast('已从仓库载入数据');
        } else if (r.reason === 'empty') {
          setStatus('仓库里还没有 data.json，可点「立即上传本地数据」创建。');
        } else if (r.reason === 'dirty') {
          setStatus('本地有未上传的修改，可点「立即上传本地数据」重试。', true);
        } else {
          setStatus('已连接。');
        }
      } catch (err) {
        setStatus('读取失败：' + (err.message || err), true);
      }
    } else {
      toast('已保存连接信息，填入 Token 后可编辑');
    }
  });

  modal.querySelector('#ghPull').addEventListener('click', async () => {
    await pullFromCloud(true);
    setStatus('已从仓库重新拉取。');
  });

  modal.querySelector('#ghPush').addEventListener('click', async () => {
    const ok = await confirmDialog({
      title: '上传本地数据到仓库',
      message: '将把本机的客户、跟进、速记和图片整体写入仓库。<br><br>如果仓库里已有 data.json，会被<strong>覆盖</strong>。确定继续？',
      confirmText: '开始上传'
    });
    if (!ok) return;
    setStatus('正在上传，请勿关闭页面…');
    try {
      const res = await migrateLocalToCloud();
      setStatus(`上传完成：客户 ${res.customers} 个、速记 ${res.notes} 条、图片 ${res.images} 张。`);
      toast('本地数据已上传到仓库');
      renderApp();
    } catch (err) {
      setStatus('上传失败：' + (err.message || err), true);
    }
  });

  modal.querySelector('#ghClear').addEventListener('click', async () => {
    const ok = await confirmDialog({
      title: '清除 Token',
      message: '清除后本机变为只读模式，需要重新填写 Token 才能修改。仓库里的数据不受影响。',
      confirmText: '清除'
    });
    if (!ok) return;
    CLOUD.token = '';
    writeLS(GH_TOKEN_KEY, null);
    state.readonly = true;
    modal.querySelector('#ghToken').value = '';
    setStatus('Token 已清除，当前只读。');
    renderSyncBar();
    renderApp();
    toast('Token 已清除');
  });
}

async function pullFromCloud(fromModal) {
  if (!CLOUD.configured()) {
    toast('请先填写仓库信息', 'info');
    return false;
  }
  try {
    const data = await CLOUD.readData();
    if (!data) {
      toast('仓库里还没有 data.json', 'info');
      return false;
    }
    await applyCloudData(data);
    writeLS(GH_DIRTY_KEY, null);
    state.syncError = '';
    if (CLOUD.writable()) {
      const meta = await CLOUD.getMeta('data.json').catch(() => null);
      CLOUD.sha = meta ? meta.sha : null;
    }
    renderApp();
    if (!fromModal) toast('已从仓库刷新数据');
    return true;
  } catch (err) {
    toast('拉取失败：' + (err.message || err), 'error');
    return false;
  }
}

async function migrateLocalToCloud() {
  if (!CLOUD.writable()) throw new Error('请先填写 GitHub Token');
  const images = await DB.getAllImages();
  let uploaded = 0;
  let imageFailed = 0;
  for (const img of images) {
    if (img.path) continue;
    if (!img.blob) continue;
    try {
      const path = await CLOUD.uploadImage(img);
      img.path = path;
      img.updatedAt = new Date().toISOString();
      await DB.putImage(img);
      uploaded++;
    } catch (err) {
      imageFailed++;
    }
  }
  await CLOUD.snapshotImages();
  const meta = await CLOUD.getMeta('data.json');
  CLOUD.sha = meta ? meta.sha : null;
  await CLOUD.pushNow(true);
  if (imageFailed) {
    toast(`${imageFailed} 张图片上传失败，其余已同步`, 'info');
  }
  return {
    customers: state.customers.length,
    notes: state.notes.length,
    images: images.filter(i => i.path || i.blob).length - imageFailed,
    uploaded
  };
}

/* ==================== 启动 ==================== */
async function init() {
  bindGlobalEvents();
  CLOUD.init();
  state.readonly = CLOUD.readonly();
  const main = document.getElementById('main');
  if (main) main.innerHTML = renderLoading();
  try {
    await reloadStateFromDB();
    state.ready = true;
  } catch (err) {
    state.ready = true;
    state.error = '本地数据库不可用：' + (err.message || err) +
      '。请使用最新版 Edge / Chrome 打开，避免无痕模式，并确认没有禁用本地存储。';
  }
  if (CLOUD.configured() || location.protocol !== 'file:') {
    try {
      const r = await CLOUD.bootstrap();
      if (r.applied) state.cloudReady = true;
    } catch (err) {
      state.syncError = '读取仓库失败：' + (err.message || err);
    }
  }
  renderApp();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
